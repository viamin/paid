services:
  prometheus:
    image: prom/prometheus:v2.47.2
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # /etc/prometheus/metrics_token is consumed by the `paid` scrape job's
      # `authorization.credentials_file`. The token file at
      # ${METRICS_TOKEN_FILE:-./prometheus/metrics_token} is created from the
      # host's METRICS_TOKEN environment variable; when METRICS_TOKEN is
      # unset the file is empty so the Bearer header is sent blank and the
      # Rails side (which only enforces the token when METRICS_TOKEN is
      # set) accepts the scrape unauthenticated.
    secrets:
      - source: metrics_token
        target: /etc/prometheus/metrics_token
        mode: 0444
    ports:
      - "9090:9090"
    networks:
      - paid_internal

  grafana:
    image: grafana/grafana:10.4.5
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-paid-observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - paid_internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    networks:
      - paid_internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-paid_admin}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-paid_admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - paid_internal

  node-exporter:
    image: prom/node-exporter:v1.7.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - paid_internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - paid_internal

volumes:
  prometheus-data:
  grafana-data:

secrets:
  # `docker compose` requires the source file to exist on the host when the
  # stack starts. ./prometheus/metrics_token is committed as an empty file
  # so the default `docker compose --profile observability up` flow works
  # without any operator action. bin/setup materializes the real token into
  # this path from the host's METRICS_TOKEN environment variable.
  metrics_token:
    file: ${METRICS_TOKEN_FILE:-./prometheus/metrics_token}
