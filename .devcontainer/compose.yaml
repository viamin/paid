name: "paid"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    shm_size: '2gb'

    volumes:
    - ../../paid:/workspaces/paid:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use a non-root user for all processes.
    user: vscode

    # Expose port 3000 for external access (e.g., Tailscale)
    ports:
    - "3000:3000"

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  postgres:
    image: postgres:16.14
    # This single container is shared by Temporal (temporal/temporal_visibility),
    # the app, the GoodJob worker, the temporal worker, and every active git
    # worktree's databases. The default max_connections=100 is exhausted under
    # that combined load; 200 gives headroom. Production sets max_connections at
    # its own DB layer (see docs/WORKER_POOL_TUNING.md).
    command: postgres -c max_connections=200
    restart: unless-stopped
    networks:
    - default
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ../docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_APP_USER: paid
      POSTGRES_APP_PASSWORD: paid
      POSTGRES_APP_DATABASES: paid_development,paid_development_cable,paid_test,paid_test_cable
      POSTGRES_MULTIPLE_DATABASES: temporal,temporal_visibility
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    networks:
    - default
    volumes:
    - ../config/temporal:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
    - "8080:8080"
    networks:
    - default

volumes:
  postgres-data:
