name: paid-memory

x-defaults: &defaults
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 64m
  cpus: 0.25
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  config:
    <<: *defaults
    restart: "no"
    image: paid-memory-config:local
    build: ./docker/memory-monitoring
    network_mode: none
    command: [sh, -ec, "cp -R /seed/. /config/; chmod -R a+rX /config"]
    volumes: [configuration:/config]
    mem_limit: 32m
    cpus: 0.1

  prometheus:
    <<: *defaults
    image: prom/prometheus:v2.47.2
    mem_limit: 384m
    cpus: 0.5
    command:
      - --config.file=/config/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
      - --storage.tsdb.wal-compression
      - --query.max-concurrency=4
    volumes: [configuration:/config:ro, prometheus-data:/prometheus]
    networks: [default, application]
    ports: ["127.0.0.1:${PAID_MEMORY_PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    <<: *defaults
    image: grafana/grafana:10.4.5
    mem_limit: 256m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /config/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /config/grafana/provisioning
    volumes: [configuration:/config:ro, grafana-data:/var/lib/grafana]
    tmpfs: [/tmp:size=32m]
    ports: ["127.0.0.1:${PAID_MEMORY_GRAFANA_PORT:-3001}:3000"]

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.7.0
    command: [--path.rootfs=/host]
    volumes: ["/:/host:ro,rslave"]

  cadvisor:
    <<: *defaults
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    privileged: true
    mem_limit: 192m
    cpus: 0.5
    command: [--docker_only=true, --housekeeping_interval=15s, --store_container_labels=false, "--enable_metrics=cpu,memory"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker:/var/lib/docker:ro", "/dev/disk:/dev/disk:ro"]

  process-exporter:
    <<: *defaults
    image: ncabatoff/process-exporter:0.8.7
    command: [--procfs=/host/proc, --config.path=/config/processes.yml, --gather-smaps=false, --threads=false, --children=false]
    volumes: ["/proc:/host/proc:ro", configuration:/config:ro]

  postgres-exporter:
    <<: *defaults
    image: prometheuscommunity/postgres-exporter:v0.15.0
    command:
      - --disable-default-metrics
      - --disable-settings-metrics
      - --no-collector.database
      - --no-collector.locks
      - --no-collector.replication
      - --no-collector.stat_bgwriter
      - --no-collector.stat_database
      - --extend.query-path=/config/queries.yml
    environment:
      DATA_SOURCE_URI: paid-postgres-1:5432/${PAID_MEMORY_DATABASE:-paid_development}?sslmode=disable
      DATA_SOURCE_USER: paid_memory_monitor
      DATA_SOURCE_PASS_FILE: /config/postgres_password
    volumes: [configuration:/config:ro]
    networks: [default, application]

networks:
  application:
    external: true
    name: ${PAID_MEMORY_APP_NETWORK:-paid_default}

volumes:
  configuration:
  prometheus-data:
  grafana-data:
