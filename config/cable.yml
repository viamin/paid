# Use solid_cable in development for cross-process broadcasting (bin/dev
# runs web and worker as separate processes via Procfile.dev).
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  # Polling interval trades latency for DB load: lower = faster updates but more queries.
  # 1s is a reasonable default; reduce to 0.1s only for low-client-count environments.
  polling_interval: <%= 1.second %>
  message_retention: <%= 1.day %>

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: <%= 1.second %>
  message_retention: <%= 1.day %>
