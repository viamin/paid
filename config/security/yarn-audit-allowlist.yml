# Yarn audit advisory exceptions.
#
# Each entry suppresses exactly one GitHub advisory that yarn audit
# continues to report after every reasonable direct fix has been applied
# (overrides, dependency upgrade, patch release). The shape is required —
# an entry without rationale, owner, expires_on, or tracking_issue is
# rejected at run time and fails CI.
#
# Why allow some advisories at all? Some advisories are reported for
# transitive dependencies that we cannot reach through a yarn
# `resolutions` override, or for packages whose maintainer has not yet
# shipped a fix. The bar for adding an entry is "we have exhausted
# direct fixes and have accepted the risk for a bounded window." The
# bar for keeping one is "we re-checked during this window whether a
# fix exists upstream."
#
# Fields (all required):
#   id              GitHub advisory ID; matches /\\AGHSA-[0-9a-z-]+\\z/.
#   module          The vulnerable npm package name.
#   reason          One-line rationale: what was tried, why it does not
#                   resolve, and what to look for to revisit.
#   owner           Accountable owner — a GitHub team handle or username.
#   expires_on      ISO 8601 date (YYYY-MM-DD). bin/audit fails the run
#                   once this date is in the past.
#   tracking_issue  GitHub issue or PR number that tracks the resolution
#                   (for example "#1234"). The wrapper does not resolve
#                   it; the field exists so reviewers can find context.
exceptions:
  - id: GHSA-vfj7-8cjw-p6xm
    module: braces
    reason: "No upstream patch available (patched_versions '<0.0.0'); reachable only as @tailwindcss/cli>@parcel/watcher>micromatch>braces, a dev-only build dependency. Reassess when @tailwindcss/cli ships a non-vulnerable transitive or when braces publishes a fix."
    owner: "@viamin/paid-frontend-platform"
    expires_on: 2026-12-31
    tracking_issue: "#4148"