# Arrow overlay for Paid.
#
# This is the dependency graph of arrow segments — the chain from high-level
# design through to realized code: HLD → LLDs → EARS → Tests → Code. Agents
# load this file first to orient before touching any per-segment arrow doc.
#
# Schema: https://github.com/jszmajda/lid/blob/main/plugins/arrow-maintenance/skills/arrow-maintenance/references/index-schema.md
#
# Paid adopts LID going-forward (Full mode, brownfield). The map below covers
# audited intent segments created under docs/intent/ while older brownfield
# areas may remain unmapped until they are converted. See docs/intent/README.md.

schema_version: 2
last_updated: 2026-08-23

# Taxonomy groups mapped segments by domain cluster. Purely organizational.
taxonomy:
  automation:
    label: Automation
    description: Automated work selection and queueing behavior.
  chat:
    label: Chat
    description: Interactive chat session behavior, workspace lifecycle, and mutation tooling.
  catalog:
    label: Catalog
    description: Model and configuration catalog synchronization behavior.
  configuration:
    label: Configuration
    description: Tenant, user, and project configuration posture management.
  knowledge:
    label: Knowledge
    description: Intent and decision artifacts captured for reuse by agents.
  intelligence:
    label: Agent Intelligence
    description: Prompt, model, and style-guide behavior that adapts based on run outcomes.
  integrations:
    label: Integrations
    description: External repository and service connectivity behavior.
  operations:
    label: Operations
    description: Billing, administration, and operator-facing control surfaces.
  runtime:
    label: Runtime
    description: Runner, preview, and language-runtime execution behavior.
  security:
    label: Security
    description: Repository and runtime security controls.
  foundation:
    label: Foundation
    description: Core control-plane, orchestration, and persistence architecture.

