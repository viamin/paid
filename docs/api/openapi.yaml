openapi: 3.0.3
info:
  title: Paid Mobile API
  version: v1
  description: |
    Schema-first contract for the Paid iOS companion. Clients MUST pin a
    commit or release ref of this document, never a moving branch.
    HTTP bearer security requirements use empty arrays as required by OpenAPI
    3.0. `x-required-pat-scopes` declares the Paid PAT scopes required by an
    operation for clients that need scope discovery.
servers:
  - url: /api/v1
paths:
  /probe:
    get:
      operationId: getApiProbe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated bearer request context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
        default:
          $ref: '#/components/responses/Error'
  /probe/stream:
    get:
      operationId: getApiProbeStream
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated probe event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /inbox:
    get:
      operationId: listInboxEntries
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/InboxKind'
        - $ref: '#/components/parameters/InboxSort'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InboxLimit'
        - $ref: '#/components/parameters/InboxCursor'
      responses:
        '200':
          description: Inbox entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxListResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
        '304':
          description: The inbox has not changed.
        default:
          $ref: '#/components/responses/Error'
  /inbox/count:
    get:
      operationId: inboxCount
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Inbox count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
        '304':
          description: The inbox count has not changed.
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getInboxEntry
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      responses:
        '200':
          description: Inbox entry detail.
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    $ref: '#/components/schemas/InboxEntry'
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}/chat:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: openInboxEntryChat
      security:
        - bearerAuth: []
      x-required-pat-scopes: [chat]
      responses:
        '201':
          description: The native chat session for this entry.
          content:
            application/json:
              schema:
                type: object
                required: [chat_session_id]
                properties:
                  chat_session_id:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /chat/sessions:
    get:
      operationId: listChatSessions
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200':
          description: Chat sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatSessionListResponse'}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '201':
          description: Created inline chat session.
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ChatSessionId'}]
    get:
      operationId: getChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Chat session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Updated chat session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: closeChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses: {'204': {description: Closed chat session}, default: {$ref: '#/components/responses/Error'}}
  /chat/sessions/{id}/{transition}:
    parameters: [{$ref: '#/components/parameters/ChatSessionId'}, {$ref: '#/components/parameters/ChatSessionTransition'}]
    patch:
      operationId: transitionChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Transitioned chat session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/messages:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/MessageBefore'}, {$ref: '#/components/parameters/MessageLimit'}]
    get:
      operationId: listChatMessages
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Cursor page of chat messages, content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessageListResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: sendChatMessage
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '201': {description: Chat response, content: {application/json: {schema: {$ref: '#/components/schemas/ChatAssistantResponse'}}}}
        '200': {description: Chat SSE stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/messages/{id}/resolve:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/MessageId'}]
    post:
      operationId: resolveChatToolCall
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Tool resolution response or SSE stream, content: {application/json: {schema: {$ref: '#/components/schemas/ChatAssistantResponse'}}, text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/diagrams/{diagram_id}/comments:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/ChatDiagramId'}]
    post:
      operationId: createChatDiagramComment
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
                element_id: {type: string}
      responses:
        '201': {description: Created diagram comment, content: {application/json: {schema: {$ref: '#/components/schemas/ChatDiagramComment'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: paid_pat
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string, pattern: '^"[0-9a-f]{64}"$'}
    ChatSessionId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    ChatSessionIdAsSessionId:
      name: session_id
      in: path
      required: true
      schema: {type: integer}
    ChatDiagramId:
      name: diagram_id
      in: path
      required: true
      schema: {type: integer}
    ChatSessionTransition:
      name: transition
      in: path
      required: true
      schema: {type: string, enum: [archive, unarchive, reopen]}
    MessageId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    MessageBefore:
      name: before
      in: query
      schema: {type: integer}
    MessageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100}
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
        format: inbox-entry-id
        pattern: '^(clarifying_questions|plan_review|merge_approval|action_required|escalated_pr|manual_review|intent_conformance|feature_decision|retry_limited|change_intent_draft|partial_closeout|test_review_pending|project_setup_pending|traceability_gap):[1-9][0-9]{0,18}$'
        description: Opaque `kind:id` queue identifier.
        example: clarifying_questions:4241
    InboxKind:
      name: kind
      in: query
      schema:
        type: string
        enum: [clarifying_questions, plan_review, merge_approval, action_required, escalated_pr, manual_review, intent_conformance, feature_decision, retry_limited, change_intent_draft, partial_closeout, test_review_pending, project_setup_pending, traceability_gap]
    InboxSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [oldest, newest]
    ProjectId:
      name: project_id
      in: query
      schema: {type: integer, minimum: 1, maximum: 9223372036854775807}
    InboxLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    InboxCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 40
        format: inbox-entry-id
        pattern: '^(clarifying_questions|plan_review|merge_approval|action_required|escalated_pr|manual_review|intent_conformance|feature_decision|retry_limited|change_intent_draft|partial_closeout|test_review_pending|project_setup_pending|traceability_gap):[1-9][0-9]{0,18}$'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, forbidden, not_found, conflict, validation_failed, stale_element, rate_limited, internal_error, provider_error, provider_unavailable]
            message: {type: string}
            details: {type: object, additionalProperties: true}
    ChatSessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/ChatSession'}}
    ChatSession:
      type: object
      required: [id, status, container_capability]
      properties:
        id: {type: integer}
        external_id: {type: string, nullable: true}
        title: {type: string, nullable: true}
        status: {type: string}
        container_capability: {type: string}
    ChatMessage:
      type: object
      required: [id, role]
      properties:
        id: {type: integer}
        external_id: {type: string, nullable: true}
        role: {type: string}
        content: {type: string, nullable: true}
        tool_status: {type: string, nullable: true}
        diagram:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChatDiagram'
    ChatDiagram:
      type: object
      required: [id, question_key, question_title, summary, text_equivalent, description, current]
      properties:
        id: {type: integer}
        question_key: {type: string}
        question_title: {type: string}
        summary: {type: string}
        text_equivalent: {type: string}
        description: {type: object, additionalProperties: true}
        current: {type: boolean}
    ChatDiagramComment:
      type: object
      required: [id, actor_id, question_key, body, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: integer}
        question_key: {type: string}
        body: {type: string}
        element_id: {type: string, nullable: true}
        element_context: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    ChatMessageListResponse:
      type: object
      required: [messages]
      properties:
        messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
        next_before: {type: integer}
    ChatAssistantResponse:
      oneOf:
        - $ref: '#/components/schemas/ChatMessage'
        - type: object
          required: [status]
          properties: {status: {type: string, enum: [paused]}}
    ProbeResponse:
      type: object
      required: [user_id, account_id]
      properties:
        user_id: {type: integer}
        account_id: {type: integer}
    InboxListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/InboxEntryListItem'
        next_cursor:
          type: string
    InboxEntryListItem:
      oneOf:
        - $ref: '#/components/schemas/ClarifyingQuestionsEntry'
        - $ref: '#/components/schemas/PlanReviewEntry'
        - $ref: '#/components/schemas/MergeApprovalEntry'
        - $ref: '#/components/schemas/ActionRequiredEntry'
        - $ref: '#/components/schemas/EscalatedPrEntry'
        - $ref: '#/components/schemas/ManualReviewListEntry'
        - $ref: '#/components/schemas/IntentConformanceEntry'
        - $ref: '#/components/schemas/FeatureDecisionEntry'
        - $ref: '#/components/schemas/RetryLimitedEntry'
        - $ref: '#/components/schemas/ChangeIntentDraftEntry'
        - $ref: '#/components/schemas/PartialCloseoutEntry'
        - $ref: '#/components/schemas/TestReviewPendingEntry'
        - $ref: '#/components/schemas/ProjectSetupPendingEntry'
        - $ref: '#/components/schemas/TraceabilityGapEntry'
      discriminator:
        propertyName: kind
        mapping:
          clarifying_questions: '#/components/schemas/ClarifyingQuestionsEntry'
          plan_review: '#/components/schemas/PlanReviewEntry'
          merge_approval: '#/components/schemas/MergeApprovalEntry'
          action_required: '#/components/schemas/ActionRequiredEntry'
          escalated_pr: '#/components/schemas/EscalatedPrEntry'
          manual_review: '#/components/schemas/ManualReviewListEntry'
          intent_conformance: '#/components/schemas/IntentConformanceEntry'
          feature_decision: '#/components/schemas/FeatureDecisionEntry'
          retry_limited: '#/components/schemas/RetryLimitedEntry'
          change_intent_draft: '#/components/schemas/ChangeIntentDraftEntry'
          partial_closeout: '#/components/schemas/PartialCloseoutEntry'
          test_review_pending: '#/components/schemas/TestReviewPendingEntry'
          project_setup_pending: '#/components/schemas/ProjectSetupPendingEntry'
          traceability_gap: '#/components/schemas/TraceabilityGapEntry'
    InboxEntry:
      oneOf:
        - $ref: '#/components/schemas/ClarifyingQuestionsEntry'
        - $ref: '#/components/schemas/PlanReviewEntry'
        - $ref: '#/components/schemas/MergeApprovalEntry'
        - $ref: '#/components/schemas/ActionRequiredEntry'
        - $ref: '#/components/schemas/EscalatedPrEntry'
        - $ref: '#/components/schemas/ManualReviewEntry'
        - $ref: '#/components/schemas/IntentConformanceEntry'
        - $ref: '#/components/schemas/FeatureDecisionEntry'
        - $ref: '#/components/schemas/RetryLimitedEntry'
        - $ref: '#/components/schemas/ChangeIntentDraftEntry'
        - $ref: '#/components/schemas/PartialCloseoutEntry'
        - $ref: '#/components/schemas/TestReviewPendingEntry'
        - $ref: '#/components/schemas/ProjectSetupPendingEntry'
        - $ref: '#/components/schemas/TraceabilityGapEntry'
      discriminator:
        propertyName: kind
        mapping:
          clarifying_questions: '#/components/schemas/ClarifyingQuestionsEntry'
          plan_review: '#/components/schemas/PlanReviewEntry'
          merge_approval: '#/components/schemas/MergeApprovalEntry'
          action_required: '#/components/schemas/ActionRequiredEntry'
          escalated_pr: '#/components/schemas/EscalatedPrEntry'
          manual_review: '#/components/schemas/ManualReviewEntry'
          intent_conformance: '#/components/schemas/IntentConformanceEntry'
          feature_decision: '#/components/schemas/FeatureDecisionEntry'
          retry_limited: '#/components/schemas/RetryLimitedEntry'
          change_intent_draft: '#/components/schemas/ChangeIntentDraftEntry'
          partial_closeout: '#/components/schemas/PartialCloseoutEntry'
          test_review_pending: '#/components/schemas/TestReviewPendingEntry'
          project_setup_pending: '#/components/schemas/ProjectSetupPendingEntry'
          traceability_gap: '#/components/schemas/TraceabilityGapEntry'
    InboxEntryBase:
      type: object
      required: [id, kind]
      properties:
        id: {type: string}
        kind: {type: string}
        waiting_since: {type: string, format: date-time, nullable: true}
        project:
          type: object
          nullable: true
          properties:
            id: {type: integer}
            owner: {type: string}
            repo: {type: string}
            name: {type: string}
        title: {type: string, nullable: true}
        summary: {type: string, nullable: true}
        action_url: {type: string, nullable: true}
    ClarifyingQuestionsEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [clarifying_questions]}
            questions: {type: array, items: {type: string}}
    PlanReviewEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [plan_review]}
            tasks: {type: array, items: {}}
    MergeApprovalEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [merge_approval]}
            blockers: {type: array, items: {}}
    ActionRequiredEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [action_required]}
            remediation_steps: {type: array, items: {}}
    EscalatedPrEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [escalated_pr]}
            reason: {type: string}
            counters: {type: array, items: {}}
            last_progress_at: {type: string, format: date-time, nullable: true}
            operator_paused: {type: boolean}
    ManualReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [manual_review]}
            questions: {type: array, items: {type: string}}
    ManualReviewEntry:
      allOf:
        - $ref: '#/components/schemas/ManualReviewListEntry'
        - type: object
          properties:
            comment_url: {type: string, nullable: true}
    IntentConformanceEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [intent_conformance]}
            verdict: {type: object, nullable: true}
            latest_decision: {type: object, nullable: true}
    FeatureDecisionEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [feature_decision]}
            ready: {type: boolean}
            blockers: {type: array, items: {}}
    RetryLimitedEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [retry_limited]}
            push_permission_abandoned: {type: boolean}
            return_count: {type: integer}
    ChangeIntentDraftEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [change_intent_draft]}
            intent: {type: string, nullable: true}
            behavior: {type: string, nullable: true}
            constraints: {type: string, nullable: true}
            decisions_made: {type: string, nullable: true}
            requested_changes_reason: {type: string, nullable: true}
    PartialCloseoutEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [partial_closeout]}
            unresolved_prerequisites: {type: array, items: {}}
    TestReviewPendingEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [test_review_pending]}
    ProjectSetupPendingEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [project_setup_pending]}
            tasks: {type: array, items: {type: string}}
    TraceabilityGapEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          required: [artifact_path, revision, state, evidence]
          properties:
            kind: {type: string, enum: [traceability_gap]}
            artifact_path: {type: string}
            revision: {type: string}
            state: {type: string, enum: [missing_tree, partial_tree, stale_metadata, deferred, unverifiable]}
            evidence: {type: array, items: {type: string}}
  headers:
    ETag:
      description: Strong validator for polling. Send this value as If-None-Match on the next poll.
      schema: {type: string}
    PrivateNoCache:
      description: Responses are user-specific and must be revalidated before reuse.
      schema: {type: string, example: 'private, max-age=0'}
  responses:
    Error:
      description: API error.
      content:
        application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
