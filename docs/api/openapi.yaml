openapi: 3.0.3
info:
  title: Paid Mobile API
  version: v1
  description: |
    Schema-first contract for the Paid iOS companion. Clients MUST pin a
    commit or release ref of this document, never a moving branch.
    HTTP bearer security requirements use empty arrays as required by OpenAPI
    3.0. `x-required-pat-scopes` declares the Paid PAT scopes required by an
    operation for clients that need scope discovery.
servers:
  - url: /api/v1
paths:
  /probe:
    get:
      operationId: getApiProbe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated bearer request context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
        default:
          $ref: '#/components/responses/Error'
  /probe/stream:
    get:
      operationId: getApiProbeStream
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated probe event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /inbox:
    get:
      operationId: listInboxEntries
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/InboxKind'
        - $ref: '#/components/parameters/InboxSort'
        - $ref: '#/components/parameters/InboxScope'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InboxLimit'
        - $ref: '#/components/parameters/InboxCursor'
      responses:
        '200':
          description: Inbox entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxListResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
        '304':
          description: The inbox has not changed.
        default:
          $ref: '#/components/responses/Error'
  /inbox/count:
    get:
      operationId: inboxCount
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Inbox count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
        '304':
          description: The inbox count has not changed.
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getInboxEntry
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      responses:
        '200':
          description: Inbox entry detail.
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    $ref: '#/components/schemas/InboxEntry'
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}/chat:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: openInboxEntryChat
      security:
        - bearerAuth: []
      x-required-pat-scopes: [chat]
      responses:
        '201':
          description: The native chat session for this entry.
          content:
            application/json:
              schema:
                type: object
                required: [chat_session_id]
                properties:
                  chat_session_id:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}/resolve_reopen_review:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: resolveInboxReopenReview
      description: >-
        Records an authorized, revision-bound reopen-review decision. The
        decision returns the issue to normal admission and does not queue an
        enhancement run.
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, revision]
              properties:
                reason:
                  type: string
                  minLength: 1
                revision:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: The reopen-review decision was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [issue_id, status]
                properties:
                  issue_id:
                    type: integer
                  status:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}/remove:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: removeInboxEntry
      description: >-
        Hides this request for the calling user only. The request, its
        questions, its history, and its automation authorization are
        unchanged, and it stays inspectable through the removed scope and a
        direct link.
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      responses:
        '200':
          description: The request is hidden for the calling user.
          content:
            application/json:
              schema:
                type: object
                required: [removed, entry_id]
                properties:
                  removed: {type: boolean}
                  entry_id: {$ref: '#/components/schemas/InboxEntryId'}
        default:
          $ref: '#/components/responses/Error'
  /inbox/entries/{entry_id}/restore:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: restoreInboxEntry
      description: >-
        Clears the calling user's personal removal so the request is eligible
        again under the normal phase-relevance rules.
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      responses:
        '200':
          description: The request is eligible for the inbox again.
          content:
            application/json:
              schema:
                type: object
                required: [restored, entry_id]
                properties:
                  restored: {type: boolean}
                  entry_id: {$ref: '#/components/schemas/InboxEntryId'}
        default:
          $ref: '#/components/responses/Error'
  /feature_intents/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/FeatureIntentId'
    post:
      operationId: cancelFeatureIntent
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellation_reason]
              properties:
                cancellation_reason:
                  type: string
                  enum: [already_handled, no_longer_wanted, superseded]
                replacement_reference:
                  type: string
      responses:
        '200':
          description: Cancelled feature intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureIntentResponse'
        default:
          $ref: '#/components/responses/Error'
  /feature_intents/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/FeatureIntentId'
    post:
      operationId: reopenFeatureIntent
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      responses:
        '200':
          description: Reopened feature intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureIntentResponse'
        default:
          $ref: '#/components/responses/Error'
  /projects/{project_id}/design_artifact_findings:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: listDesignArtifactFindings
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      responses:
        '200':
          description: |
            Actionable design-artifact findings for the project. Informational
            deferred-state findings (draft/superseded/historical artifacts) are
            retained durably but excluded; unverifiable coverage failures stay
            listed as access/coverage problems.
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings:
                    type: array
                    items: {$ref: '#/components/schemas/DesignArtifactFinding'}
        default:
          $ref: '#/components/responses/Error'
  /projects/{project_id}/design_artifact_findings/{id}/repair_document_links:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: integer}
      - name: id
        in: path
        required: true
        schema: {type: integer}
    post:
      operationId: repairDesignArtifactDocumentLinks
      security:
        - bearerAuth: []
      x-required-pat-scopes: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: string}
      responses:
        '200':
          description: Queued or reused document-link repair run.
          content:
            application/json:
              schema:
                type: object
                required: [finding, agent_run]
                properties:
                  finding: {type: object}
                  agent_run:
                    type: object
                    required: [id, status]
                    properties:
                      id: {type: integer}
                      status: {type: string, enum: [queued, running, paused]}
        default:
          $ref: '#/components/responses/Error'
  /chat/sessions:
    get:
      operationId: listChatSessions
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200':
          description: Chat sessions.
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatSessionListResponse'}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '201':
          description: Created inline chat session.
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ChatSessionId'}]
    get:
      operationId: getChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Chat session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Updated chat session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: closeChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses: {'204': {description: Closed chat session}, default: {$ref: '#/components/responses/Error'}}
  /chat/sessions/{id}/{transition}:
    parameters: [{$ref: '#/components/parameters/ChatSessionId'}, {$ref: '#/components/parameters/ChatSessionTransition'}]
    patch:
      operationId: transitionChatSession
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Transitioned chat session, content: {application/json: {schema: {$ref: '#/components/schemas/ChatSession'}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/messages:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/MessageBefore'}, {$ref: '#/components/parameters/MessageLimit'}]
    get:
      operationId: listChatMessages
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Cursor page of chat messages, content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessageListResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: sendChatMessage
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '201': {description: Chat response, content: {application/json: {schema: {$ref: '#/components/schemas/ChatAssistantResponse'}}}}
        '200': {description: Chat SSE stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/messages/{id}/resolve:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/MessageId'}]
    post:
      operationId: resolveChatToolCall
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Tool resolution response or SSE stream, content: {application/json: {schema: {$ref: '#/components/schemas/ChatAssistantResponse'}}, text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/investigations:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}]
    get:
      operationId: listChatInvestigations
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Reconnectable question investigations., content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createChatInvestigation
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '201': {description: Investigation queued or awaiting additional authorization., content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/investigations/{id}:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/ChatInvestigationId'}]
    get:
      operationId: getChatInvestigation
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Investigation status and result., content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/investigations/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/ChatInvestigationId'}]
    post:
      operationId: cancelChatInvestigation
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      responses:
        '200': {description: Cancelled investigation., content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Error'}
  /chat/sessions/{session_id}/diagrams/{diagram_id}/comments:
    parameters: [{$ref: '#/components/parameters/ChatSessionIdAsSessionId'}, {$ref: '#/components/parameters/ChatDiagramId'}]
    post:
      operationId: createChatDiagramComment
      security: [{bearerAuth: []}]
      x-required-pat-scopes: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
                element_id: {type: string}
      responses:
        '201': {description: Created diagram comment, content: {application/json: {schema: {$ref: '#/components/schemas/ChatDiagramComment'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: paid_pat
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string, pattern: '^"[0-9a-f]{64}"$'}
    ChatSessionId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    FeatureIntentId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    ChatSessionIdAsSessionId:
      name: session_id
      in: path
      required: true
      schema: {type: integer}
    ChatInvestigationId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    ChatDiagramId:
      name: diagram_id
      in: path
      required: true
      schema: {type: integer}
    ChatSessionTransition:
      name: transition
      in: path
      required: true
      schema: {type: string, enum: [archive, unarchive, reopen]}
    MessageId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    MessageBefore:
      name: before
      in: query
      schema: {type: integer}
    MessageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100}
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
        format: inbox-entry-id
        pattern: '^((clarifying_questions|plan_review|merge_approval|action_required|escalated_pr|manual_review|intent_conformance|feature_decision|retry_limited|change_intent_draft|partial_closeout|test_review_pending|project_setup_pending|traceability_gap):[1-9][0-9]{0,18}|dependency_cycle:[0-9a-f]{20})$'
        description: Opaque `kind:id` queue identifier.
        example: clarifying_questions:4241
    InboxKind:
      name: kind
      in: query
      schema:
        type: string
        enum: [clarifying_questions, plan_review, merge_approval, action_required, escalated_pr, manual_review, intent_conformance, feature_decision, retry_limited, change_intent_draft, partial_closeout, test_review_pending, project_setup_pending, traceability_gap, dependency_cycle]
    InboxSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [oldest, newest]
    InboxScope:
      name: scope
      in: query
      description: >-
        actionable (default) is the phase-relevant list; disabled_phases lists
        requests held back by a disabled project phase; removed lists the
        calling user's personally removed requests.
      schema:
        type: string
        enum: [actionable, disabled_phases, removed]
    ProjectId:
      name: project_id
      in: query
      schema: {type: integer, minimum: 1, maximum: 9223372036854775807}
    InboxLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    InboxCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 40
        format: inbox-entry-id
        pattern: '^((clarifying_questions|plan_review|merge_approval|action_required|escalated_pr|manual_review|intent_conformance|feature_decision|retry_limited|change_intent_draft|partial_closeout|test_review_pending|project_setup_pending|traceability_gap):[1-9][0-9]{0,18}|dependency_cycle:[0-9a-f]{20})$'
  schemas:
    InboxEntryId:
      type: string
      maxLength: 40
      format: inbox-entry-id
      pattern: '^((clarifying_questions|plan_review|merge_approval|action_required|escalated_pr|manual_review|intent_conformance|feature_decision|retry_limited|change_intent_draft|partial_closeout|test_review_pending|project_setup_pending|traceability_gap):[1-9][0-9]{0,18}|dependency_cycle:[0-9a-f]{20})$'
      description: Opaque `kind:id` queue identifier.
      example: clarifying_questions:4241
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, forbidden, not_found, conflict, validation_failed, stale_element, rate_limited, internal_error, provider_error, provider_unavailable]
            message: {type: string}
            details: {type: object, additionalProperties: true}
    ChatSessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/ChatSession'}}
    ChatSession:
      type: object
      required: [id, status, container_capability]
      properties:
        id: {type: integer}
        external_id: {type: string, nullable: true}
        title: {type: string, nullable: true}
        status: {type: string}
        container_capability: {type: string}
    ChatMessage:
      type: object
      required: [id, role]
      properties:
        id: {type: integer}
        external_id: {type: string, nullable: true}
        role: {type: string}
        content: {type: string, nullable: true}
        tool_status: {type: string, nullable: true}
        diagram:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChatDiagram'
    ChatDiagram:
      type: object
      required: [id, question_key, question_title, summary, text_equivalent, description, current]
      properties:
        id: {type: integer}
        question_key: {type: string}
        question_title: {type: string}
        summary: {type: string}
        text_equivalent: {type: string}
        description: {type: object, additionalProperties: true}
        current: {type: boolean}
    ChatDiagramComment:
      type: object
      required: [id, actor_id, question_key, body, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: integer}
        question_key: {type: string}
        body: {type: string}
        element_id: {type: string, nullable: true}
        element_context: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    ChatMessageListResponse:
      type: object
      required: [messages]
      properties:
        messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
        next_before: {type: integer}
    ChatAssistantResponse:
      oneOf:
        - $ref: '#/components/schemas/ChatMessage'
        - type: object
          required: [status]
          properties: {status: {type: string, enum: [paused]}}
    ProbeResponse:
      type: object
      required: [user_id, account_id]
      properties:
        user_id: {type: integer}
        account_id: {type: integer}
    FeatureIntentResponse:
      type: object
      required: [id, status, cancelled_at, cancellation_reason, replacement_reference]
      properties:
        id: {type: integer}
        status: {type: string}
        cancelled_at: {type: string, format: date-time, nullable: true}
        cancellation_reason: {type: string, nullable: true}
        replacement_reference: {type: string, nullable: true}
    InboxListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/InboxEntryListItem'
        next_cursor:
          type: string
    InboxEntryListItem:
      oneOf:
        - $ref: '#/components/schemas/ClarifyingQuestionsEntry'
        - $ref: '#/components/schemas/PlanReviewEntry'
        - $ref: '#/components/schemas/MergeApprovalEntry'
        - $ref: '#/components/schemas/ActionRequiredEntry'
        - $ref: '#/components/schemas/EscalatedPrEntry'
        - $ref: '#/components/schemas/ManualReviewListEntry'
        - $ref: '#/components/schemas/IntentConformanceEntry'
        - $ref: '#/components/schemas/FeatureDecisionEntry'
        - $ref: '#/components/schemas/RetryLimitedEntry'
        - $ref: '#/components/schemas/ChangeIntentDraftEntry'
        - $ref: '#/components/schemas/PartialCloseoutEntry'
        - $ref: '#/components/schemas/TestReviewPendingEntry'
        - $ref: '#/components/schemas/ProjectSetupPendingEntry'
        - $ref: '#/components/schemas/TraceabilityGapEntry'
        - $ref: '#/components/schemas/LayeredVerificationFindingEntry'
        - $ref: '#/components/schemas/DependencyCycleEntry'
      discriminator:
        propertyName: kind
        mapping:
          clarifying_questions: '#/components/schemas/ClarifyingQuestionsEntry'
          plan_review: '#/components/schemas/PlanReviewEntry'
          merge_approval: '#/components/schemas/MergeApprovalEntry'
          action_required: '#/components/schemas/ActionRequiredEntry'
          escalated_pr: '#/components/schemas/EscalatedPrEntry'
          manual_review: '#/components/schemas/ManualReviewListEntry'
          intent_conformance: '#/components/schemas/IntentConformanceEntry'
          feature_decision: '#/components/schemas/FeatureDecisionEntry'
          retry_limited: '#/components/schemas/RetryLimitedEntry'
          change_intent_draft: '#/components/schemas/ChangeIntentDraftEntry'
          partial_closeout: '#/components/schemas/PartialCloseoutEntry'
          test_review_pending: '#/components/schemas/TestReviewPendingEntry'
          project_setup_pending: '#/components/schemas/ProjectSetupPendingEntry'
          traceability_gap: '#/components/schemas/TraceabilityGapEntry'
          layered_verification_finding: '#/components/schemas/LayeredVerificationFindingEntry'
          dependency_cycle: '#/components/schemas/DependencyCycleEntry'
    InboxEntry:
      oneOf:
        - $ref: '#/components/schemas/ClarifyingQuestionsEntry'
        - $ref: '#/components/schemas/PlanReviewEntry'
        - $ref: '#/components/schemas/MergeApprovalEntry'
        - $ref: '#/components/schemas/ActionRequiredEntry'
        - $ref: '#/components/schemas/EscalatedPrEntry'
        - $ref: '#/components/schemas/ManualReviewEntry'
        - $ref: '#/components/schemas/IntentConformanceEntry'
        - $ref: '#/components/schemas/FeatureDecisionEntry'
        - $ref: '#/components/schemas/RetryLimitedEntry'
        - $ref: '#/components/schemas/ChangeIntentDraftEntry'
        - $ref: '#/components/schemas/PartialCloseoutEntry'
        - $ref: '#/components/schemas/TestReviewPendingEntry'
        - $ref: '#/components/schemas/ProjectSetupPendingEntry'
        - $ref: '#/components/schemas/TraceabilityGapEntry'
        - $ref: '#/components/schemas/LayeredVerificationFindingEntry'
        - $ref: '#/components/schemas/DependencyCycleEntry'
      discriminator:
        propertyName: kind
        mapping:
          clarifying_questions: '#/components/schemas/ClarifyingQuestionsEntry'
          plan_review: '#/components/schemas/PlanReviewEntry'
          merge_approval: '#/components/schemas/MergeApprovalEntry'
          action_required: '#/components/schemas/ActionRequiredEntry'
          escalated_pr: '#/components/schemas/EscalatedPrEntry'
          manual_review: '#/components/schemas/ManualReviewEntry'
          intent_conformance: '#/components/schemas/IntentConformanceEntry'
          feature_decision: '#/components/schemas/FeatureDecisionEntry'
          retry_limited: '#/components/schemas/RetryLimitedEntry'
          change_intent_draft: '#/components/schemas/ChangeIntentDraftEntry'
          partial_closeout: '#/components/schemas/PartialCloseoutEntry'
          test_review_pending: '#/components/schemas/TestReviewPendingEntry'
          project_setup_pending: '#/components/schemas/ProjectSetupPendingEntry'
          traceability_gap: '#/components/schemas/TraceabilityGapEntry'
          layered_verification_finding: '#/components/schemas/LayeredVerificationFindingEntry'
          dependency_cycle: '#/components/schemas/DependencyCycleEntry'
    InboxEntryBase:
      type: object
      required: [id, kind]
      properties:
        id: {type: string}
        kind: {type: string}
        waiting_since: {type: string, format: date-time, nullable: true}
        project:
          type: object
          nullable: true
          properties:
            id: {type: integer}
            owner: {type: string}
            repo: {type: string}
            name: {type: string}
        title: {type: string, nullable: true}
        summary: {type: string, nullable: true}
        action_url: {type: string, nullable: true}
    ClarifyingQuestionsEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [clarifying_questions]}
            questions: {type: array, items: {type: string}}
    PlanReviewEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [plan_review]}
            tasks: {type: array, items: {}}
    MergeApprovalEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [merge_approval]}
            blockers: {type: array, items: {}}
    ActionRequiredEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [action_required]}
            remediation_steps: {type: array, items: {}}
    EscalatedPrEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [escalated_pr]}
            reason: {type: string}
            counters: {type: array, items: {}}
            last_progress_at: {type: string, format: date-time, nullable: true}
            operator_paused: {type: boolean}
    ManualReviewListEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [manual_review]}
            questions: {type: array, items: {type: string}}
    ManualReviewEntry:
      allOf:
        - $ref: '#/components/schemas/ManualReviewListEntry'
        - type: object
          properties:
            comment_url: {type: string, nullable: true}
    IntentConformanceEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [intent_conformance]}
            verdict: {type: object, nullable: true}
            latest_decision: {type: object, nullable: true}
    FeatureDecisionEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [feature_decision]}
            delivery_policy: {type: string, enum: [approval_gated, confidence_driven]}
            ready: {type: boolean}
            blockers: {type: array, items: {}}
            human_actions:
              type: array
              items:
                type: object
                required: [kind, message]
                properties:
                  kind: {type: string}
                  message: {type: string}
            decisions:
              type: array
              items:
                type: object
                required: [id, kind, prompt, design_claim]
                properties:
                  id: {type: integer}
                  kind: {type: string, enum: [question, inferred_decision]}
                  prompt: {type: string}
                  design_claim: {type: string}
            affected_tasks:
              type: array
              items:
                type: object
                required: [number, title, url]
                properties:
                  number: {type: integer}
                  title: {type: string}
                  url: {type: string}
            design_revisions:
              type: array
              items:
                type: object
                required: [number, revision, state, url]
                properties:
                  number: {type: integer}
                  revision: {type: string}
                  state: {type: string, enum: [merged, stale, open]}
                  url: {type: string}
    RetryLimitedEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [retry_limited]}
            push_permission_abandoned: {type: boolean}
            return_count: {type: integer}
    ChangeIntentDraftEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [change_intent_draft]}
            intent: {type: string, nullable: true}
            behavior: {type: string, nullable: true}
            constraints: {type: string, nullable: true}
            decisions_made: {type: string, nullable: true}
            requested_changes_reason: {type: string, nullable: true}
    PartialCloseoutEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [partial_closeout]}
            unresolved_prerequisites: {type: array, items: {}}
    TestReviewPendingEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [test_review_pending]}
    ProjectSetupPendingEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [project_setup_pending]}
            tasks: {type: array, items: {type: string}}
    TraceabilityGapEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          required: [artifact_path, revision, state, evidence]
          properties:
            kind: {type: string, enum: [traceability_gap]}
            artifact_path: {type: string}
            revision: {type: string}
            state: {type: string, enum: [missing_tree, partial_tree, stale_metadata, deferred, unverifiable]}
            evidence: {type: array, items: {type: string}}
            covered_at: {type: string, format: date-time}
            recommended_action: {type: string}
    LayeredVerificationFindingEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          properties:
            kind: {type: string, enum: [layered_verification_finding]}
    DependencyCycleEntry:
      allOf:
        - $ref: '#/components/schemas/InboxEntryBase'
        - type: object
          required: [cycle_path, cycle_edges, downstream_issues_held]
          properties:
            kind: {type: string, enum: [dependency_cycle]}
            cycle_path:
              type: array
              minItems: 2
              items: {$ref: '#/components/schemas/DependencyCycleIssue'}
            cycle_edges:
              type: array
              minItems: 1
              items:
                type: object
                required: [from, to, declaration_source, declaration_url]
                properties:
                  from: {$ref: '#/components/schemas/DependencyCycleIssue'}
                  to: {$ref: '#/components/schemas/DependencyCycleIssue'}
                  declaration_source: {type: string, enum: [issue_body, issue_comment], nullable: true}
                  declaration_url: {type: string, format: uri, nullable: true}
            downstream_issues_held: {type: integer, minimum: 0}
    DependencyCycleIssue:
      type: object
      required: [project, number, url, title, labels]
      properties:
        project: {type: string}
        number: {type: integer}
        url: {type: string, format: uri}
        title: {type: string}
        labels: {type: array, items: {type: string}}
        parent:
          type: object
          nullable: true
          required: [project, number, url, title]
          properties:
            project: {type: string}
            number: {type: integer}
            url: {type: string, format: uri}
            title: {type: string}
    DesignArtifactFinding:
      type: object
      required: [id, artifact_path, revision, state, evidence, covered_at, status]
      properties:
        id: {type: integer}
        artifact_path: {type: string}
        revision: {type: string}
        state: {type: string, enum: [missing_tree, partial_tree, stale_metadata, deferred, unverifiable]}
        evidence: {type: array, items: {type: string}}
        covered_at: {type: string, format: date-time}
        status: {type: string, enum: [open, assigned, deferred, dismissed, resolved]}
        resolution_state: {type: string, nullable: true}
        resolution_reason: {type: string, nullable: true}
        resolution_issue_id: {type: integer, nullable: true}
  headers:
    ETag:
      description: Strong validator for polling. Send this value as If-None-Match on the next poll.
      schema: {type: string}
    PrivateNoCache:
      description: Responses are user-specific and must be revalidated before reuse.
      schema: {type: string, example: 'private, max-age=0'}
  responses:
    Error:
      description: API error.
      content:
        application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
