name: System tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel in-progress system test runs on the same PR when a new commit is
# pushed. Don't cancel runs on `main` (those are gating the changelog).
concurrency:
  group: system-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  system:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_TEST_DATABASE: paid_test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TMPDIR: ${{ github.workspace }}/.tmp-build
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache-yarn
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      COVERAGE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace cache directories
        run: mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME" "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME"
          yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          # GitHub's Ubuntu runners sometimes ship unrelated Microsoft sources
          # that transiently 403 and break apt-get update before PGDG installs.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -print0 | xargs -0 --no-run-if-empty grep -lZ 'packages.microsoft.com' | sudo xargs -0 --no-run-if-empty rm -f
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Locate Chromium-family browser
        # Prefer a preinstalled browser when one exists, but don't fail the
        # workflow if the runner image changes. The system suite falls back to
        # rack_test automatically when CHROMIUM_PATH is absent, and browser-only
        # coverage lives in explicitly opted-in specs.
        run: |
          path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -n "$path" ]; then
            echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
            "$path" --version
          else
            echo "No Chromium-family browser found; falling back to rack_test."
          fi

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Bootstrap test defaults
        run: bin/rails ci:bootstrap_test_defaults

      - name: Run system specs
        run: bin/rspec spec/system

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-test-failures
          # Capybara screenshots live under tmp/capybara/. Test logs help
          # diagnose server-side issues that don't show up in the screenshot.
          path: |
            tmp/capybara/**
            log/test.log
          if-no-files-found: ignore
          retention-days: 7
