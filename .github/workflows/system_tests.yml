name: System tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel in-progress system test runs on the same PR when a new commit is
# pushed. Don't cancel runs on `main` (those are gating the changelog).
concurrency:
  group: system-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  system:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      COVERAGE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Locate Chromium-family browser
        # Prefer a preinstalled browser when one exists, but don't fail the
        # workflow if the runner image changes. The system suite falls back to
        # rack_test automatically when CHROMIUM_PATH is absent, and browser-only
        # coverage lives in explicitly opted-in specs.
        run: |
          path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -n "$path" ]; then
            echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
            "$path" --version
          else
            echo "No Chromium-family browser found; falling back to rack_test."
          fi

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:prepare

      - name: Run system specs
        run: bin/rspec spec/system

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-test-failures
          # Capybara screenshots live under tmp/capybara/. Test logs help
          # diagnose server-side issues that don't show up in the screenshot.
          path: |
            tmp/capybara/**
            log/test.log
          if-no-files-found: ignore
          retention-days: 7
