name: System tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel in-progress system test runs on the same PR when a new commit is
# pushed. Don't cancel runs on `main` (those are gating the changelog).
concurrency:
  group: system-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  system:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    # A Gemfile.lock change invalidates ruby/setup-ruby's bundle cache, and the
    # dependency installer can retry for up to 30 minutes before assets and the
    # browser suite begin. Leave enough room for the checks to complete.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_DEVELOPMENT_DATABASE: paid_test
      PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
      PAID_TEST_DATABASE: paid_test
      DATABASE_URL: postgres://paid:paid@localhost:5432/paid_test
      DB_HOST: localhost
      PGHOST: localhost
      PGPORT: 5432
      DB_USERNAME: paid
      PGUSER: paid
      DB_PASSWORD: paid
      PGPASSWORD: paid
      TMPDIR: ${{ github.workspace }}/.tmp-build
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache-yarn
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      COVERAGE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            delimiter="ghadelim_$(openssl rand -hex 16)"
            {
              echo "RAILS_TEST_KEY<<${delimiter}"
              printf '%s\n' "$RAILS_MASTER_KEY_FALLBACK"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace cache directories
        run: mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME" "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME"
          retry_with_backoff() {
            local timeout_limit="$1"
            local warning_message="$2"
            shift 2
            local attempt
            for attempt in 1 2 3; do
              if timeout "$timeout_limit" "$@"; then
                return 0
              fi
              echo "::warning::${warning_message} (attempt $attempt/3); retrying"
              sleep "$((attempt * 10))"
            done
            return 1
          }
          retry_with_backoff \
            10m \
            "JavaScript dependency install timed out or failed" \
            bash -lc 'yarn install --frozen-lockfile && bin/yarn-postinstall'

      - name: Install PostgreSQL client
        # @spec TOOLCHAIN-PIN-028
        run: |
          # The PGDG signing key download flakes on GitHub runners. Publishing an
          # unverified key makes every later apt-get update fail with "The repository
          # ... is not signed" and takes the whole job down, so fetch the key with
          # retries, verify it, and only then trust the repository. Without a usable
          # key the same major client is installed from the runner image's own archive.
          keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          key_download="$(mktemp)"
          sudo install -d /usr/share/postgresql-common/pgdg
          key_ready=false
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key_download" \
              && gpg --batch --with-colons --show-keys "$key_download" | awk -F: '$1 == "fpr" { valid = ($10 == "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"); exit } END { exit(valid ? 0 : 1) }'; then
              sudo mv "$key_download" "$keyring"
              key_ready=true
              break
            fi
            echo "::warning::PGDG signing key download failed (attempt $attempt/3); retrying"
            rm -f "$key_download"
            sleep "$((attempt * 5))"
          done
          rm -f "$key_download"
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: %s\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" "$keyring" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          # GitHub's Ubuntu runners sometimes ship unrelated Microsoft sources
          # that transiently 403 and break apt-get update before PGDG installs.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -print0 | xargs -0 --no-run-if-empty grep -lZ 'packages.microsoft.com' | sudo xargs -0 --no-run-if-empty rm -f
          # Bound each apt command and retry so a stalled mirror costs minutes
          # instead of the job dying at its overall timeout.
          apt_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 5m apt-get \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Acquire::Retries=3 "$@"; then
                return 0
              fi
              echo "::warning::apt-get $* timed out or failed (attempt $attempt/3); retrying"
              sleep "$((attempt * 10))"
            done
            return 1
          }
          if [ "$key_ready" != true ]; then
            echo "::warning::PGDG signing key unavailable; installing postgresql-client-16 from the runner image archive"
            sudo rm -f /etc/apt/sources.list.d/pgdg.sources "$keyring"
          fi
          if ! apt_with_retry update; then
            echo "::warning::apt-get update failed; retrying without the PGDG repository"
            sudo rm -f /etc/apt/sources.list.d/pgdg.sources "$keyring"
            apt_with_retry update
          fi
          apt_with_retry install -y postgresql-client-16
          psql --version

      - name: Create application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h "$DB_HOST" -U postgres -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'paid') THEN
              CREATE ROLE paid LOGIN PASSWORD 'paid';
            ELSE
              ALTER ROLE paid WITH LOGIN PASSWORD 'paid';
            END IF;
          END
          $$;
          ALTER ROLE paid CREATEDB NOSUPERUSER NOBYPASSRLS;
          SQL

      - name: Install browser runtime libraries
        # @spec TOOLCHAIN-PIN-029
        run: |
          sudo apt-get install --no-install-recommends -y libglib2.0-0t64 libgtk-3-0t64

      - name: Set up Chrome
        id: setup_chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Export Chromium path
        env:
          INSTALLED_CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
        run: |
          chrome_path="${INSTALLED_CHROME_PATH}"
          if [ -n "$chrome_path" ] && [ -x "$chrome_path" ]; then
            echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
            echo "Chrome available at ${chrome_path}"
            "$chrome_path" --version
          else
            echo "::error::No Chrome/Chromium binary found after setup"
            exit 1
          fi

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: |
          for attempt in 1 2 3; do
            if bin/rails db:create db:schema:load; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Database setup failed (attempt $attempt/3); retrying"
              sleep "$((attempt * 5))"
            fi
          done

          exit 1

      - name: Bootstrap test defaults
        run: bin/rails ci:bootstrap_test_defaults

      - name: Run system specs
        run: bin/rspec spec/system

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-test-failures
          # Capybara screenshots live under tmp/capybara/. Test logs help
          # diagnose server-side issues that don't show up in the screenshot.
          path: |
            tmp/capybara/**
            log/test.log
          if-no-files-found: ignore
          retention-days: 7
