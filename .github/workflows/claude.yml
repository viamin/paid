name: Claude Code

# Triggers: Claude runs when @claude is mentioned in issue/PR comments,
# PR review comments, PR reviews, or newly opened issues. A separate
# verify job checks actual write access with minimal permissions before
# the main claude job runs with elevated permissions. This two-job
# design limits exposure of write-scoped tokens to verified actors.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  verify:
    # Lightweight gate: check that the actor actually has write access.
    # Runs with read-only permissions so even if an untrusted actor
    # somehow passes the `if` filter, no write token is exposed.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body || '', '@claude') &&
        (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'issues' &&
        (
          contains(github.event.issue.body || '', '@claude') ||
          contains(github.event.issue.title, '@claude')
        ) &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check-permissions.outputs.allowed }}
    steps:
      - name: Check actor repository permission
        id: check-permissions
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$ACTOR" ]; then
            echo "::error::Could not determine actor"
            exit 1
          fi
          # Query the actor's repository permission. Handle failures and missing
          # permissions gracefully so unauthorized users cause a no-op instead
          # of failing the workflow.
          if ! PERM=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null); then
            echo "::notice::Could not determine permission for ${ACTOR}; treating as no access"
            PERM=""
          fi
          echo "User ${ACTOR} has permission: ${PERM:-<none>}"
          if [[ "$PERM" == "admin" || "$PERM" == "maintain" || "$PERM" == "write" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::User ${ACTOR} does not have write access (has: ${PERM:-<none>})"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: verify
    # Defense-in-depth: require both the verify job gate AND author_association
    # checks directly on this privileged job. Even if the verify output were
    # somehow bypassed, this condition independently rejects unauthorized actors.
    # The author_association checks also make the authorization visible to static
    # analysis tools (CodeQL js/actions/checkout-of-untrusted-code).
    if: |
      needs.verify.outputs.allowed == 'true' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    # Claude Code requires write access to create comments, branches, and
    # commits. id-token:write is needed for OIDC authentication.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Re-verify actor permission
        # Mitigates TOCTOU: re-check write access at execution time, not
        # just at the verify-job gate. If permissions were revoked between
        # jobs, this step fails the workflow before any write-scoped action
        # runs. (Addresses CodeQL js/actions/checkout-of-untrusted-code and
        # untrusted-checkout-toctou alerts.)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          if [[ "$PERM" != "admin" && "$PERM" != "maintain" && "$PERM" != "write" ]]; then
            echo "::error::Actor ${ACTOR} no longer has write access (has: ${PERM})"
            exit 1
          fi

      - name: Checkout repository
        # Checks out the default branch only — never a PR head ref.
        # Uses github.sha (immutable commit at event-creation time) rather
        # than the branch name to eliminate TOCTOU on the ref itself.
        # The claude-code-action handles PR ref access internally after
        # its own permission checks, so this checkout only needs the base
        # repo code for configuration files (CLAUDE.md, etc.).
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        # CodeQL flags this step as untrusted checkout (TOCTOU /
        # untrusted-code). Accepted risk — mitigations in place:
        # (1) job-level author_association check (defense-in-depth),
        # (2) verify job gates on author_association + gh API permission,
        # (3) re-verify step re-checks write access at execution time,
        # (4) checkout uses github.sha (immutable) — never a PR head ref,
        # (5) persist-credentials: false limits token exposure.
        # The residual alert is inherent to claude-code-action, which
        # internally handles PR refs after its own permission checks.
        # This is outside our control and accepted per security review.
        uses: anthropics/claude-code-action@26ec041249acb0a944c0a47b6c0c13f05dbc5b44 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read
