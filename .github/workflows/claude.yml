name: Claude Code

# Triggers: Claude runs when @claude is mentioned in issue/PR comments,
# PR review comments, PR reviews, or newly opened issues. The job-level
# `if` condition filters each event to only fire when @claude appears in
# the relevant body/title and the actor has appropriate association.
# A separate permission verification step checks actual write access.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body || '', '@claude') &&
        (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'issues' &&
        (
          contains(github.event.issue.body || '', '@claude') ||
          contains(github.event.issue.title, '@claude')
        ) &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    # Claude Code requires write access to create comments, branches, and
    # commits. id-token:write is needed for OIDC authentication. These
    # permissions are gated behind the author_association check above and the
    # explicit permission verification step below, limiting exposure.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Verify write permission
        # author_association alone doesn't reliably map to repo permissions
        # (e.g., MEMBER can be read-only in an org). This step checks the
        # commenter's actual repository permission level via the GitHub API.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Determine the actor directly from the GitHub Actions context
          ACTOR="${{ github.actor }}"
          if [ -z "$ACTOR" ]; then
            echo "::error::Could not determine actor"
            exit 1
          fi
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission')
          echo "User ${ACTOR} has permission: ${PERM}"
          if [[ "$PERM" != "admin" && "$PERM" != "maintain" && "$PERM" != "write" ]]; then
            echo "::error::User ${ACTOR} does not have write access (has: ${PERM})"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@26ec041249acb0a944c0a47b6c0c13f05dbc5b44 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read
