name: Claude Code Review

# Paid triggers this workflow only when the project's ci_action review method
# is enabled, using repository_dispatch with the PR number in client_payload.
on:
  repository_dispatch:
    types: [claude-review]

concurrency:
  group: claude-review-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_DEVELOPMENT_DATABASE: paid_test
      PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
      PAID_TEST_DATABASE: paid_test
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Resolve pull request metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::repository_dispatch payload must include client_payload.pr_number"
            exit 1
          fi

          pr_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

          echo "base_sha=$(jq -r '.base.sha' <<<\"${pr_json}\")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<\"${pr_json}\")" >> "$GITHUB_OUTPUT"
          echo "head_repo_fork=$(jq -r '.head.repo.fork' <<<\"${pr_json}\")" >> "$GITHUB_OUTPUT"
          echo "author_login=$(jq -r '.user.login' <<<\"${pr_json}\")" >> "$GITHUB_OUTPUT"
          echo "author_association=$(jq -r '.author_association' <<<\"${pr_json}\")" >> "$GITHUB_OUTPUT"

      - name: Decide whether review is allowed
        id: trust
        env:
          AUTHOR_ASSOCIATION: ${{ steps.pr.outputs.author_association }}
          AUTHOR_LOGIN: ${{ steps.pr.outputs.author_login }}
        run: |
          case "${AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              case "${AUTHOR_LOGIN}" in
                "dependabot[bot]"|"renovate[bot]"|"github-actions[bot]"|"paid-agents[bot]")
                  echo "allowed=true" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "allowed=false" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              ;;
          esac

      - name: Start PR head check run
        if: steps.pr.outputs.head_repo_fork != 'true' && steps.trust.outputs.allowed == 'true'
        id: check-run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            -d @- <<JSON
          {
            "name": "Claude Code Review",
            "head_sha": "${HEAD_SHA}",
            "status": "in_progress"
          }
          JSON
          )

          echo "id=$(jq -r '.id' <<<\"${response}\")" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.pr.outputs.head_repo_fork != 'true' && steps.trust.outputs.allowed == 'true'
        # Check out the base branch (not the PR head) so that config files
        # (CLAUDE.md, etc.) come from trusted code. The action retrieves
        # PR diffs via the GitHub API, so it does not need the PR ref.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.base_sha }}
          persist-credentials: false

      - name: Skip fork-backed PRs without blocking the CI gate
        if: steps.pr.outputs.head_repo_fork == 'true'
        run: echo "Skipping Claude review for fork-backed PR."

      - name: Skip untrusted PRs without blocking the CI gate
        if: steps.pr.outputs.head_repo_fork != 'true' && steps.trust.outputs.allowed != 'true'
        run: echo "Skipping Claude review for untrusted PR author."

      - name: Run Claude Code Review
        if: steps.pr.outputs.head_repo_fork != 'true' && steps.trust.outputs.allowed == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@459ad358ae43fea66bfefd0a1f8d840b4b9791fb # v1
        with:
          # IMPORTANT: Authentication uses an OAuth token, NOT an API key.
          # Create the CLAUDE_CODE_OAUTH_TOKEN secret (not an Anthropic API key)
          # in Settings > Secrets and variables > Actions before enabling.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Plugin marketplace from the claude-code repo (separate from
          # claude-code-action). Uses main branch since this repo does not
          # share commit SHAs with the action repo.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The action runs in a Docker container, so the Rails test database
          # must be addressed by the service hostname rather than localhost.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.client_payload.pr_number }}'
          allowed_bots: "dependabot[bot],paid-agents[bot]"

      - name: Complete PR head check run
        if: always() && steps.pr.outputs.head_repo_fork != 'true' && steps.trust.outputs.allowed == 'true'
        env:
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO_FORK: ${{ steps.pr.outputs.head_repo_fork }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        run: |
          set -euo pipefail

          completed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          conclusion="failure"
          summary="Claude review workflow did not complete successfully."

          if [ "${HEAD_REPO_FORK}" = "true" ]; then
            conclusion="success"
            summary="Claude review skipped for fork-backed PR."
          elif [ "${CLAUDE_REVIEW_OUTCOME}" = "success" ]; then
            conclusion="success"
            summary="Claude review completed successfully."
          elif [ "${CLAUDE_REVIEW_OUTCOME}" = "cancelled" ]; then
            conclusion="cancelled"
            summary="Claude review workflow was cancelled."
          fi

          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
            -d @- <<JSON
          {
            "name": "Claude Code Review",
            "status": "completed",
            "conclusion": "${conclusion}",
            "completed_at": "${completed_at}",
            "output": {
              "title": "Claude Code Review",
              "summary": "${summary}"
            }
          }
          JSON
