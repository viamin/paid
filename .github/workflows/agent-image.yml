name: Agent Image

on:
  pull_request:
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - Gemfile.lock
      - scripts/build-agent-image.sh
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh
  push:
    branches: [ main ]
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - Gemfile.lock
      - scripts/build-agent-image.sh
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh

permissions:
  contents: read

jobs:
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract ruby-maat version from Gemfile.lock
        id: ruby-maat
        run: |
          version=$(sed -n '/^GEM$/,/^$/s/^  *ruby-maat (\(.*\))/\1/p' Gemfile.lock | head -n 1)
          if [ -z "$version" ]; then
            echo "Failed to extract ruby-maat version from Gemfile.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@a4effe49ee3ee5b8916d8f84b1528502f3f8e5b0 # v1.237.0
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Extract Gemini CLI install command from agent-harness
        id: gemini-cli
        run: |
          command=$(bundle exec ruby -e '
            require "agent_harness"
            contract = AgentHarness::Providers::Gemini.install_contract
            puts contract[:install_command_string]
          ')
          if [ -z "$command" ]; then
            echo "Failed to extract Gemini CLI install command from agent-harness" >&2
            exit 1
          fi
          echo "install_command=$command" >> "$GITHUB_OUTPUT"

      - name: Build paid-agent image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./docker/agent
          file: ./docker/agent/Dockerfile
          load: true
          pull: true
          tags: paid-agent:latest
          build-args: |
            RUBY_MAAT_VERSION=${{ steps.ruby-maat.outputs.version }}
            GEMINI_CLI_INSTALL_COMMAND=${{ steps.gemini-cli.outputs.install_command }}
          cache-from: type=gha,scope=paid-agent
          cache-to: type=gha,mode=max,scope=paid-agent

      - name: Smoke test paid-agent image
        run: ./scripts/test-agent-image.sh
