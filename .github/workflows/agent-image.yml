name: Agent Image

on:
  pull_request:
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - Gemfile.lock
      - scripts/build-agent-image.sh
      - scripts/extract-provider-install-contract.rb
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh
      - scripts/test-agent-provider-contracts.sh
      - scripts/test-agent-provider-contracts-inner.sh
      - app/services/containers/provision.rb
      - lib/provider_support.rb
  push:
    branches: [ main ]
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - Gemfile.lock
      - scripts/build-agent-image.sh
      - scripts/extract-provider-install-contract.rb
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh
      - scripts/test-agent-provider-contracts.sh
      - scripts/test-agent-provider-contracts-inner.sh
      - app/services/containers/provision.rb
      - lib/provider_support.rb

permissions:
  contents: read

jobs:
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract ruby-maat version from Gemfile.lock
        id: ruby-maat
        run: |
          version=$(sed -n '/^GEM$/,/^$/s/^  *ruby-maat (\(.*\))/\1/p' Gemfile.lock | head -n 1)
          if [ -z "$version" ]; then
            echo "Failed to extract ruby-maat version from Gemfile.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Extract Claude install contract from agent-harness
        id: claude-contract
        run: |
          contract=$(bundle exec ruby scripts/extract-provider-install-contract.rb claude)
          install_command=$(echo "$contract" | sed -n 's/^INSTALL_COMMAND=//p')
          post_install_path=$(echo "$contract" | sed -n 's/^POST_INSTALL_BINARY_PATH=//p')
          if [ -z "$install_command" ]; then
            echo "Failed to extract Claude install command from agent-harness" >&2
            exit 1
          fi
          if [ -z "$post_install_path" ]; then
            echo "Failed to extract Claude post-install binary path from agent-harness" >&2
            exit 1
          fi
          echo "install_command<<PAID_EOF" >> "$GITHUB_OUTPUT"
          echo "$install_command" >> "$GITHUB_OUTPUT"
          echo "PAID_EOF" >> "$GITHUB_OUTPUT"
          echo "post_install_binary_path<<PAID_EOF" >> "$GITHUB_OUTPUT"
          echo "$post_install_path" >> "$GITHUB_OUTPUT"
          echo "PAID_EOF" >> "$GITHUB_OUTPUT"

      - name: Extract Cursor install contract from agent-harness
        id: cursor-contract
        run: |
          contract=$(bundle exec ruby scripts/extract-provider-install-contract.rb cursor)
          artifact_url=$(echo "$contract" | sed -n 's/^ARTIFACT_URL=//p')
          artifact_sha256=$(echo "$contract" | sed -n 's/^ARTIFACT_SHA256=//p')
          binary_name=$(echo "$contract" | sed -n 's/^BINARY_NAME=//p')
          global_path=$(echo "$contract" | sed -n 's/^GLOBAL_PATH=//p')
          if [ -z "$artifact_url" ]; then
            echo "Failed to extract Cursor artifact URL from agent-harness" >&2
            exit 1
          fi
          if [ -z "$artifact_sha256" ]; then
            echo "Failed to extract Cursor artifact SHA256 from agent-harness" >&2
            exit 1
          fi
          if [ -z "$binary_name" ]; then
            echo "Failed to extract Cursor binary name from agent-harness" >&2
            exit 1
          fi
          if [ -z "$global_path" ]; then
            echo "Failed to extract Cursor global path from agent-harness" >&2
            exit 1
          fi
          echo "artifact_url=$artifact_url" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "binary_name=$binary_name" >> "$GITHUB_OUTPUT"
          echo "global_path=$global_path" >> "$GITHUB_OUTPUT"

      - name: Extract Codex package from agent-harness
        id: codex-contract
        run: |
          contract=$(bundle exec ruby scripts/extract-provider-install-contract.rb codex)
          package=$(echo "$contract" | sed -n 's/^PACKAGE=//p')
          if [ -z "$package" ]; then
            echo "Failed to extract Codex package from agent-harness" >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Extract Kilocode CLI install contract from agent-harness
        id: kilocode-contract
        run: |
          contract=$(bundle exec ruby scripts/extract-provider-install-contract.rb kilocode)
          install_command=$(echo "$contract" | sed -n 's/^INSTALL_COMMAND=//p')
          if [ -z "$install_command" ]; then
            echo "Failed to extract Kilocode CLI install command from agent-harness" >&2
            exit 1
          fi
          echo "install_command<<PAID_EOF" >> "$GITHUB_OUTPUT"
          echo "$install_command" >> "$GITHUB_OUTPUT"
          echo "PAID_EOF" >> "$GITHUB_OUTPUT"

      - name: Extract Gemini CLI install contract from agent-harness
        id: gemini-contract
        run: |
          contract=$(bundle exec ruby scripts/extract-provider-install-contract.rb gemini)
          install_command=$(echo "$contract" | sed -n 's/^INSTALL_COMMAND=//p')
          if [ -z "$install_command" ]; then
            echo "Failed to extract Gemini CLI install command from agent-harness" >&2
            exit 1
          fi
          echo "install_command<<PAID_EOF" >> "$GITHUB_OUTPUT"
          echo "$install_command" >> "$GITHUB_OUTPUT"
          echo "PAID_EOF" >> "$GITHUB_OUTPUT"

      - name: Build paid-agent image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./docker/agent
          file: ./docker/agent/Dockerfile
          load: true
          pull: true
          tags: paid-agent:latest
          build-args: |
            RUBY_MAAT_VERSION=${{ steps.ruby-maat.outputs.version }}
            CLAUDE_INSTALL_COMMAND=${{ steps.claude-contract.outputs.install_command }}
            CLAUDE_POST_INSTALL_BINARY_PATH=${{ steps.claude-contract.outputs.post_install_binary_path }}
            CURSOR_ARTIFACT_URL=${{ steps.cursor-contract.outputs.artifact_url }}
            CURSOR_ARTIFACT_SHA256=${{ steps.cursor-contract.outputs.artifact_sha256 }}
            CURSOR_BINARY_NAME=${{ steps.cursor-contract.outputs.binary_name }}
            CURSOR_GLOBAL_PATH=${{ steps.cursor-contract.outputs.global_path }}
            CODEX_PACKAGE=${{ steps.codex-contract.outputs.package }}
            KILOCODE_INSTALL_COMMAND=${{ steps.kilocode-contract.outputs.install_command }}
            GEMINI_CLI_INSTALL_COMMAND=${{ steps.gemini-contract.outputs.install_command }}
          cache-from: type=gha,scope=paid-agent
          cache-to: type=gha,mode=max,scope=paid-agent

      - name: Smoke test paid-agent image
        run: ./scripts/test-agent-image.sh

      - name: Provider-contract smoke test
        run: ./scripts/test-agent-provider-contracts.sh
