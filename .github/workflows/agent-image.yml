name: Agent Image

on:
  pull_request:
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - scripts/build-agent-image.sh
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh
  push:
    branches: [ main ]
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - scripts/build-agent-image.sh
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh

permissions:
  contents: read

jobs:
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build paid-agent image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./docker/agent
          file: ./docker/agent/Dockerfile
          load: true
          pull: true
          tags: paid-agent:latest
          cache-from: type=gha,scope=paid-agent
          cache-to: type=gha,mode=max,scope=paid-agent

      - name: Smoke test paid-agent image
        run: ./scripts/test-agent-image.sh
