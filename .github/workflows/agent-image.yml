name: Agent Image

on:
  pull_request:
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - Gemfile.lock
      - scripts/build-agent-image.sh
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh
  push:
    branches: [ main ]
    paths:
      - .github/workflows/agent-image.yml
      - docker/agent/**
      - Gemfile.lock
      - scripts/build-agent-image.sh
      - scripts/test-agent-image.sh
      - scripts/test-agent-image-inner.sh

permissions:
  contents: read

jobs:
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract ruby-maat version from Gemfile.lock
        id: ruby-maat
        run: |
          version=$(sed -n '/^GEM$/,/^$/s/^  *ruby-maat (\(.*\))/\1/p' Gemfile.lock | head -n 1)
          if [ -z "$version" ]; then
            echo "Failed to extract ruby-maat version from Gemfile.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build paid-agent image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./docker/agent
          file: ./docker/agent/Dockerfile
          load: true
          pull: true
          tags: paid-agent:latest
          build-args: |
            RUBY_MAAT_VERSION=${{ steps.ruby-maat.outputs.version }}
          cache-from: type=gha,scope=paid-agent
          cache-to: type=gha,mode=max,scope=paid-agent

      - name: Smoke test paid-agent image
        run: ./scripts/test-agent-image.sh
