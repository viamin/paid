name: Security

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Run daily at 06:00 UTC to catch new advisories
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Run security audit and secret scan
        # @spec REPO-DEPENDENCY-AUDIT-006 — yarn audit (via bin/yarn-audit-check)
        # fails the workflow on uncovered findings, scanner failures, or
        # malformed/expired allowlist entries, exactly like brakeman and
        # bundler-audit already do. The structured summary below is also
        # surfaced in the step summary so accepted advisories stay visible.
        id: security_audit
        run: bin/audit

      - name: Surface accepted advisories in the run summary
        if: always()
        env:
          CONCLUSION: ${{ steps.security_audit.conclusion }}
        run: |
          {
            echo "## Security audit"
            echo
            echo "Bin/audit step conclusion: \`${CONCLUSION}\` (success means no uncovered advisories, no scanner errors, and an unexpired allowlist)."
            echo
            echo "Accepted (allowlisted) advisories remain visible in the job log under \`== Yarn audit ==\`."
            echo "A failure means either an uncovered advisory was reported, a scanner/network/registry failure occurred, or the allowlist at \`config/security/yarn-audit-allowlist.yml\` is malformed or expired."
            echo
            echo "Renew an entry by editing \`config/security/yarn-audit-allowlist.yml\` (rationale, owner, expires_on, tracking_issue are all required) or remove the entry once a fix is in place."
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-scan:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan GitHub Actions workflows with Zizmor
        run: bin/zizmor-scan
