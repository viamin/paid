name: PR Screenshots

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Clean up uploaded screenshots when PRs are closed/merged
  pull_request_target:
    types: [ closed ]

# Permissions are set per-job to minimize blast radius.
# The capture job only needs read; publish/cleanup only need the scoped access
# required to comment on the PR and access object storage credentials.

# Cancel in-progress screenshot runs on the same PR when a new commit is pushed.
# Uses PR number instead of github.ref so pull_request_target events (which resolve
# to the base branch) don't collide across PRs.
concurrency:
  group: pr-screenshots-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_ui_changes: ${{ steps.check.outputs.has_ui_changes }}
      ui_files: ${{ steps.check.outputs.ui_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Detect UI-facing changes
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          diff_files=$(git diff --name-only "${BASE_SHA}"..."${HEAD_SHA}")

          if [ -z "$diff_files" ]; then
            echo "has_ui_changes=false" >> "$GITHUB_OUTPUT"
            echo "ui_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ui_files=$(
            DIFF_FILES="$diff_files" ruby -rjson -e '
              require_relative "app/services/screenshots/detect_ui_changes"
              changed_files = ENV.fetch("DIFF_FILES", "").split("\n").map(&:strip).reject(&:empty?)
              result = Screenshots::DetectUiChanges.call(changed_files: changed_files)
              print result.fetch(:ui_files).join("\n")
            '
          )

          if [ -n "$ui_files" ]; then
            echo "has_ui_changes=true" >> "$GITHUB_OUTPUT"
            # Store file list as base64 to preserve newlines
            echo "ui_files=$(echo "$ui_files" | base64 -w 0)" >> "$GITHUB_OUTPUT"
            echo "UI-facing files changed:"
            echo "$ui_files" | sed 's/^/  /'
          else
            echo "has_ui_changes=false" >> "$GITHUB_OUTPUT"
            echo "ui_files=" >> "$GITHUB_OUTPUT"
            echo "No UI-facing file changes detected."
          fi

  capture:
    needs: detect
    if: needs.detect.outputs.has_ui_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: paid
      DB_PASSWORD: paid
      SCREENSHOT_OUTPUT_DIR: tmp/screenshots

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16=16.13-1.pgdg24.04+1

      - name: Create application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h "$DB_HOST" -U postgres -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'paid') THEN
              CREATE ROLE paid LOGIN PASSWORD 'paid' CREATEDB NOSUPERUSER NOBYPASSRLS;
            ELSE
              ALTER ROLE paid WITH LOGIN PASSWORD 'paid' CREATEDB NOSUPERUSER NOBYPASSRLS;
            END IF;
          END;
          $$;
          SQL

      - name: Verify Chrome binary
        run: |
          chrome_path="${CHROMIUM_PATH:-}"
          if [ -z "$chrome_path" ]; then
            for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
              if [ -x "$candidate" ]; then
                chrome_path="$candidate"
                break
              fi
            done
          fi
          if [ -n "$chrome_path" ] && [ -x "$chrome_path" ]; then
            echo "Chrome found at ${chrome_path}"
            "$chrome_path" --version
          else
            echo "::error::No Chrome/Chromium binary found"
            exit 1
          fi

      - name: Export changed UI files
        env:
          UI_FILES_B64: ${{ needs.detect.outputs.ui_files }}
        run: |
          printf 'CHANGED_FILES<<EOF\n%s\nEOF\n' "$(printf '%s' "$UI_FILES_B64" | base64 -d)" >> "$GITHUB_ENV"

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:prepare

      - name: Capture screenshots
        id: capture_screenshots
        run: bin/rails screenshots:capture

      - name: Upload screenshots to artifacts
        id: upload_screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-screenshots
          path: tmp/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  # Separate job for publishing screenshots after capture.
  publish:
    needs: [detect, capture]
    if: >-
      always()
      && needs.capture.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      # Storage credentials — Screenshots::Storage.configured? requires both
      # access-key and secret-key to be present. Without these the publish task
      # raises for any captured PNGs and cleanup_pr silently no-ops.
      SCREENSHOTS_S3_ACCESS_KEY_ID: ${{ secrets.SCREENSHOTS_S3_ACCESS_KEY_ID }}
      SCREENSHOTS_S3_SECRET_ACCESS_KEY: ${{ secrets.SCREENSHOTS_S3_SECRET_ACCESS_KEY }}
      SCREENSHOTS_S3_BUCKET: ${{ secrets.SCREENSHOTS_S3_BUCKET }}
      SCREENSHOTS_S3_REGION: ${{ secrets.SCREENSHOTS_S3_REGION }}
      SCREENSHOTS_S3_ENDPOINT: ${{ secrets.SCREENSHOTS_S3_ENDPOINT }}
      # Target repository and token — defaults to the workflow repo for same-repo
      # PRs. Set SCREENSHOTS_GITHUB_TOKEN and SCREENSHOTS_TARGET_REPO secrets to
      # post screenshots to a tracked project's target-repository PR instead.
      GITHUB_TOKEN: ${{ secrets.SCREENSHOTS_GITHUB_TOKEN || github.token }}
      GITHUB_REPOSITORY: ${{ secrets.SCREENSHOTS_TARGET_REPO || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Download screenshot artifacts
        id: download_screenshots
        if: needs.capture.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: pr-screenshots
          path: screenshots-download

      - name: Publish screenshots and refresh PR comment
        if: always()
        run: |
          bin/rails screenshots:publish SCREENSHOT_OUTPUT_DIR=screenshots-download

  # When a synchronize event removes all UI changes, update the stale comment
  # so reviewers aren't misled by outdated screenshots.
  cleanup:
    needs: detect
    if: >-
      needs.detect.outputs.has_ui_changes == 'false'
      && github.event.action == 'synchronize'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Update stale screenshot comment
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOTS_GITHUB_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_REPO: ${{ secrets.SCREENSHOTS_TARGET_REPO || github.repository }}
        run: |
          marker="<!-- pr-screenshots-comment -->"
          existing_comment_id=$(gh api \
            "repos/${TARGET_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            2>/dev/null | head -1)

          if [ -z "$existing_comment_id" ]; then
            echo "No existing screenshot comment to clean up."
            exit 0
          fi

          body="${marker}\n## 📸 UI Screenshots\n\n"
          body+="This PR **no longer contains UI-facing changes**. "
          body+="The previously captured screenshots are outdated and can be ignored.\n"

          printf '%b' "$body" | gh api \
            "repos/${TARGET_REPO}/issues/comments/${existing_comment_id}" \
            --method PATCH \
            --field "body=@-"

  # Clean up uploaded screenshots when a PR is closed or merged.
  cleanup-storage:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Delete PR screenshots from storage
        env:
          BUNDLE_FROZEN: "true"
          RAILS_ENV: test
          SCREENSHOTS_S3_ACCESS_KEY_ID: ${{ secrets.SCREENSHOTS_S3_ACCESS_KEY_ID }}
          SCREENSHOTS_S3_SECRET_ACCESS_KEY: ${{ secrets.SCREENSHOTS_S3_SECRET_ACCESS_KEY }}
          SCREENSHOTS_S3_BUCKET: ${{ secrets.SCREENSHOTS_S3_BUCKET }}
          SCREENSHOTS_S3_REGION: ${{ secrets.SCREENSHOTS_S3_REGION }}
          SCREENSHOTS_S3_ENDPOINT: ${{ secrets.SCREENSHOTS_S3_ENDPOINT }}
          GITHUB_REPOSITORY: ${{ secrets.SCREENSHOTS_TARGET_REPO || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bin/rails screenshots:cleanup_pr
