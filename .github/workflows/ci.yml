name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ephemeral-tests-guard:
    name: No ephemeral tests on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check for stray ephemeral test files
        run: |
          stray=$(find .ephemeral-tests -type f \( -name '*_spec.rb' -o -name '*_test.js' -o -name '*_test.ts' \) 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error::Ephemeral test files found on main (should only exist on PR branches):"
            echo "$stray"
            echo "::group::Files found"
            echo "$stray"
            echo "::endgroup::"
            exit 1
          fi
          echo "No stray ephemeral test files."

  lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Prepare RuboCop cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run lint checks
        run: bin/lint

      - name: Verify Postgres image pins are in sync
        # Keep the Postgres server image pin aligned across compose, devcontainer,
        # and CI, and ensure installed client tools use the exact matching pg_dump version.
        run: |
          check_contains() {
            local file="$1"
            local expected="$2"
            local message="$3"

            if ! grep -Fq "$expected" "$file"; then
              echo "::error file=$file::$message"
              exit 1
            fi
          }

          dev=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .devcontainer/compose.yaml | head -1 | awk '{print $NF}')
          compose=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' docker-compose.yml | head -1 | awk '{print $NF}')
          ci=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .github/workflows/ci.yml | head -1 | awk '{print $NF}')
          systest=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .github/workflows/system_tests.yml | head -1 | awk '{print $NF}')
          test_prof=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .github/workflows/test_prof.yml | head -1 | awk '{print $NF}')
          screenshots=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .github/workflows/pr-screenshots.yml | head -1 | awk '{print $NF}')
          ephemeral=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .github/workflows/ephemeral_tests.yml | head -1 | awk '{print $NF}')
          version=${compose#postgres:}
          major=${version%%.*}
          bookworm_client="postgresql-client-${major}=${version}-1.pgdg12+1"
          trixie_client="postgresql-client-${major}=${version}-1.pgdg13+1"
          noble_client="postgresql-client-${major}=${version}-1.pgdg24.04+1"

          echo "devcontainer/compose.yaml:       ${dev:-<none>}"
          echo "docker-compose.yml:              ${compose:-<none>}"
          echo ".github/workflows/ci.yml:        ${ci:-<none>}"
          echo ".github/workflows/system_tests:  ${systest:-<none>}"
          echo ".github/workflows/test_prof.yml: ${test_prof:-<none>}"
          echo ".github/workflows/pr-screenshots:${screenshots:-<none>}"
          echo ".github/workflows/ephemeral:     ${ephemeral:-<none>}"
          echo "expected Bookworm client:        ${bookworm_client}"
          echo "expected Trixie client:          ${trixie_client}"
          echo "expected Noble client:           ${noble_client}"
          if [ -z "$dev" ] || [ -z "$compose" ] || [ -z "$ci" ] || [ -z "$systest" ] || [ -z "$test_prof" ] || [ -z "$screenshots" ] || [ -z "$ephemeral" ]; then
            echo "::error::Postgres image pin missing in one or more files"
            exit 1
          fi
          if [ "$dev" != "$compose" ] || [ "$compose" != "$ci" ] || [ "$ci" != "$systest" ] || [ "$systest" != "$test_prof" ] || [ "$test_prof" != "$screenshots" ] || [ "$screenshots" != "$ephemeral" ]; then
            echo "::error::Postgres image pins are out of sync. Update all workflow and compose references together."
            exit 1
          fi
          check_contains .devcontainer/Dockerfile "$bookworm_client" ".devcontainer/Dockerfile is not pinned to $bookworm_client"
          check_contains Dockerfile "$trixie_client" "Dockerfile is not pinned to $trixie_client"
          check_contains docker/agent/Dockerfile "$noble_client" "docker/agent/Dockerfile is not pinned to $noble_client"
          check_contains docker/agent/Dockerfile "apt.postgresql.org/pub/repos/apt" "docker/agent/Dockerfile must install from PGDG"
          check_contains Dockerfile "apt.postgresql.org/pub/repos/apt" "Dockerfile must install from PGDG"
          check_contains .github/workflows/ci.yml "$noble_client" ".github/workflows/ci.yml is not pinned to $noble_client"
          check_contains .github/workflows/system_tests.yml "$noble_client" ".github/workflows/system_tests.yml is not pinned to $noble_client"
          check_contains .github/workflows/test_prof.yml "$noble_client" ".github/workflows/test_prof.yml is not pinned to $noble_client"
          check_contains .github/workflows/pr-screenshots.yml "$noble_client" ".github/workflows/pr-screenshots.yml is not pinned to $noble_client"
          check_contains .github/workflows/ephemeral_tests.yml "$noble_client" ".github/workflows/ephemeral_tests.yml is not pinned to $noble_client"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_TEST_DATABASE: paid_test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install ast-grep
        run: bin/install-ast-grep

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16=16.13-1.pgdg24.04+1

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:prepare

      - name: Verify Qdrant health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused "$QDRANT_URL/healthz"

      - name: Run tests
        # System specs run in a separate workflow (.github/workflows/system_tests.yml)
        # because they need Chromium and built JS/CSS assets.
        run: bin/rspec --exclude-pattern "spec/performance/**/*_spec.rb,spec/system/**/*_spec.rb"

      - name: Run query performance benchmarks
        run: COVERAGE=false bin/rspec spec/performance

  fasterer:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Run fasterer
        run: bundle exec fasterer

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_TEST_DATABASE: paid_test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16=16.13-1.pgdg24.04+1

      - name: Set up database
        run: bin/rails db:prepare

      - name: Run performance benchmarks
        run: >
          scripts/performance/benchmark.rb
          --seed-ci-data
          --require-metrics container_startup_time,workflow_latency,dashboard_load_time,search_latency
          --baseline docs/performance/baseline.json
          --fail-on-regression

      - name: Print performance report
        run: cat tmp/performance/report.md
