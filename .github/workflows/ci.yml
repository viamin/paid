name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ephemeral-tests-guard:
    name: No ephemeral tests on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for stray ephemeral test files
        run: |
          stray=$(find .ephemeral-tests -type f \( -name '*_spec.rb' -o -name '*_test.js' -o -name '*_test.ts' \) 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error::Ephemeral test files found on main (should only exist on PR branches):"
            echo "$stray"
            echo "::group::Files found"
            echo "$stray"
            echo "::endgroup::"
            exit 1
          fi
          echo "No stray ephemeral test files."

  lint:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run lint checks
        run: bin/lint

      - name: Verify Postgres image pins and client install sources are in sync
        # Keep the Postgres server image pin aligned across compose, devcontainer,
        # and CI. Docker images pin the exact client package version because they
        # build once, while GitHub-hosted workflow jobs install the matching
        # major client package from PGDG at runtime.
        #
        # @spec TOOLCHAIN-PIN-024
        run: |
          check_contains() {
            local file="$1"
            local expected="$2"
            local message="$3"

            if ! grep -Fq "$expected" "$file"; then
              echo "::error file=$file::$message"
              exit 1
            fi
          }

          check_matches() {
            local file="$1"
            local pattern="$2"
            local message="$3"

            if ! grep -Eq "$pattern" "$file"; then
              echo "::error file=$file::$message"
              exit 1
            fi
          }

          extract_postgres_image() {
            local file="$1"
            grep -oE 'image:[[:space:]]+([^[:space:]]+/)*postgres:[^[:space:]]+' "$file" | head -1 | awk '{print $NF}'
          }

          postgres_version() {
            local image="$1"
            printf '%s\n' "${image##*:}"
          }

          dev=$(extract_postgres_image .devcontainer/compose.yaml)
          compose=$(extract_postgres_image docker-compose.yml)
          ci=$(extract_postgres_image .github/workflows/ci.yml)
          claude_review=$(extract_postgres_image .github/workflows/claude-code-review.yml)
          systest=$(extract_postgres_image .github/workflows/system_tests.yml)
          test_prof=$(extract_postgres_image .github/workflows/test_prof.yml)
          screenshots=$(extract_postgres_image .github/workflows/pr-screenshots.yml)
          screenshots_publish=$(extract_postgres_image .github/workflows/pr-screenshots-publish.yml)
          ephemeral=$(extract_postgres_image .github/workflows/ephemeral_tests.yml)
          dev_version=$(postgres_version "$dev")
          compose_version=$(postgres_version "$compose")
          ci_version=$(postgres_version "$ci")
          claude_review_version=$(postgres_version "$claude_review")
          systest_version=$(postgres_version "$systest")
          test_prof_version=$(postgres_version "$test_prof")
          screenshots_version=$(postgres_version "$screenshots")
          screenshots_publish_version=$(postgres_version "$screenshots_publish")
          ephemeral_version=$(postgres_version "$ephemeral")
          version="$compose_version"
          major=${version%%.*}
          workflow_client="postgresql-client-${major}"
          escaped_version="${version//./\\.}"
          # PGDG's package revision is not derivable from the upstream version --
          # the same release ships as +1 for one version and +2 for the next -- so
          # match the revision rather than assuming it. bin/update resolves the
          # real value from the PGDG package index.
          client_pattern() {
            printf 'postgresql-client-%s=%s-[0-9]+\\.pgdg%s\\+[0-9]+' "$major" "$escaped_version" "$1"
          }
          bookworm_client="$(client_pattern 12)"
          trixie_client="$(client_pattern 13)"
          noble_client="$(client_pattern 24\\.04)"

          echo "devcontainer/compose.yaml:       ${dev:-<none>}"
          echo "docker-compose.yml:              ${compose:-<none>}"
          echo ".github/workflows/ci.yml:        ${ci:-<none>}"
          echo ".github/workflows/claude-review: ${claude_review:-<none>}"
          echo ".github/workflows/system_tests:  ${systest:-<none>}"
          echo ".github/workflows/test_prof.yml: ${test_prof:-<none>}"
          echo ".github/workflows/pr-screenshots:${screenshots:-<none>}"
          echo ".github/workflows/screenshots-publish: ${screenshots_publish:-<none>}"
          echo ".github/workflows/ephemeral:     ${ephemeral:-<none>}"
          echo "expected workflow client:        ${workflow_client}"
          echo "expected Bookworm client match:  ${bookworm_client}"
          echo "expected Trixie client match:    ${trixie_client}"
          echo "expected Noble client match:     ${noble_client}"
          if [ -z "$dev" ] || [ -z "$compose" ] || [ -z "$ci" ] || [ -z "$claude_review" ] || [ -z "$systest" ] || [ -z "$test_prof" ] || [ -z "$screenshots" ] || [ -z "$screenshots_publish" ] || [ -z "$ephemeral" ]; then
            echo "::error::Postgres image pin missing in one or more files"
            exit 1
          fi
          if [ "$dev_version" != "$compose_version" ] || [ "$compose_version" != "$ci_version" ] || [ "$ci_version" != "$claude_review_version" ] || [ "$claude_review_version" != "$systest_version" ] || [ "$systest_version" != "$test_prof_version" ] || [ "$test_prof_version" != "$screenshots_version" ] || [ "$screenshots_version" != "$screenshots_publish_version" ] || [ "$screenshots_publish_version" != "$ephemeral_version" ]; then
            echo "::error::Postgres image pins are out of sync. Update all workflow and compose references together."
            exit 1
          fi
          check_matches .devcontainer/Dockerfile "$bookworm_client" ".devcontainer/Dockerfile does not pin a Bookworm client built from PostgreSQL $version"
          check_matches Dockerfile "$trixie_client" "Dockerfile does not pin a Trixie client built from PostgreSQL $version"
          check_matches docker/agent/Dockerfile "$noble_client" "docker/agent/Dockerfile does not pin a Noble client built from PostgreSQL $version"
          check_contains docker/agent/Dockerfile "apt.postgresql.org/pub/repos/apt" "docker/agent/Dockerfile must install from PGDG"
          check_contains Dockerfile "apt.postgresql.org/pub/repos/apt" "Dockerfile must install from PGDG"
          check_contains .github/workflows/ci.yml "apt.postgresql.org/pub/repos/apt" ".github/workflows/ci.yml must install PostgreSQL client tools from PGDG"
          check_contains .github/workflows/system_tests.yml "apt.postgresql.org/pub/repos/apt" ".github/workflows/system_tests.yml must install PostgreSQL client tools from PGDG"
          check_contains .github/workflows/test_prof.yml "apt.postgresql.org/pub/repos/apt" ".github/workflows/test_prof.yml must install PostgreSQL client tools from PGDG"
          check_contains .github/workflows/pr-screenshots.yml "apt.postgresql.org/pub/repos/apt" ".github/workflows/pr-screenshots.yml must install PostgreSQL client tools from PGDG"
          check_contains .github/workflows/ephemeral_tests.yml "apt.postgresql.org/pub/repos/apt" ".github/workflows/ephemeral_tests.yml must install PostgreSQL client tools from PGDG"
          check_contains .github/workflows/ci.yml "$workflow_client" ".github/workflows/ci.yml must install $workflow_client"
          check_contains .github/workflows/system_tests.yml "$workflow_client" ".github/workflows/system_tests.yml must install $workflow_client"
          check_contains .github/workflows/test_prof.yml "$workflow_client" ".github/workflows/test_prof.yml must install $workflow_client"
          check_contains .github/workflows/pr-screenshots.yml "$workflow_client" ".github/workflows/pr-screenshots.yml must install $workflow_client"
          check_contains .github/workflows/ephemeral_tests.yml "$workflow_client" ".github/workflows/ephemeral_tests.yml must install $workflow_client"

  test:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    # The non-system RSpec slice alone can exceed 38 minutes on a warm local
    # run, so 45 minutes leaves too little margin for checkout, asset builds,
    # database setup, and the performance-spec tail on slower GitHub runners.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_DEVELOPMENT_DATABASE: paid_test
      PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
      PAID_TEST_DATABASE: paid_test
      # Keep Rails, libpq shellouts, and any child processes on the same test
      # database connection flow instead of relying on split DB_* / PG* vars.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/paid_test
      DB_HOST: localhost
      PGHOST: localhost
      PGPORT: 5432
      DB_USERNAME: postgres
      PGUSER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
      TMPDIR: ${{ github.workspace }}/.tmp-build
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache-yarn
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            delimiter="ghadelim_$(openssl rand -hex 16)"
            {
              echo "RAILS_TEST_KEY<<${delimiter}"
              printf '%s\n' "$RAILS_MASTER_KEY_FALLBACK"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace cache directories
        run: mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME" "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME"
          yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install ast-grep
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          INSTALL_DIR="$HOME/.local/bin" bin/install-ast-grep

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          # GitHub's Ubuntu runners sometimes ship unrelated Microsoft sources
          # that transiently 403 and break apt-get update before PGDG installs.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -print0 | xargs -0 --no-run-if-empty grep -lZ 'packages.microsoft.com' | sudo xargs -0 --no-run-if-empty rm -f
          # Ubuntu archive downloads also stall mid-transfer on some runners; apt
          # then waits forever and the job dies at its overall timeout. Bound each
          # apt command and retry so a stalled mirror costs minutes, not the run.
          apt_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 5m apt-get \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Acquire::Retries=3 "$@"; then
                return 0
              fi
              echo "::warning::apt-get $* timed out or failed (attempt $attempt/3); retrying"
              sleep "$((attempt * 10))"
            done
            return 1
          }
          apt_with_retry update
          apt_with_retry install -y postgresql-client-16

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Bootstrap test defaults
        run: bin/rails ci:bootstrap_test_defaults

      - name: Verify Qdrant health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused "$QDRANT_URL/healthz"

      - name: Run tests
        # System specs run in a separate workflow (.github/workflows/system_tests.yml)
        # because they need Chromium and built JS/CSS assets.
        run: bin/rspec --exclude-pattern "spec/performance/**/*_spec.rb,spec/system/**/*_spec.rb"

      - name: Run query performance benchmarks
        run: COVERAGE=false bin/rspec spec/performance

  migrations:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_DEVELOPMENT_DATABASE: paid_test
      PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
      PAID_TEST_DATABASE: paid_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/paid_test
      DB_HOST: localhost
      PGHOST: localhost
      PGPORT: 5432
      DB_USERNAME: postgres
      PGUSER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # bin/ci-migration-replay reads db/schema.rb from HEAD^.
          fetch-depth: 2

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            delimiter="ghadelim_$(openssl rand -hex 16)"
            {
              echo "RAILS_TEST_KEY<<${delimiter}"
              printf '%s\n' "$RAILS_MASTER_KEY_FALLBACK"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      # HEAD^ is the base branch tip: on a pull request HEAD is the merge commit,
      # and on a push to main it is the previous main commit. bin/ci-migration-replay
      # loads that revision's schema so only the migrations this branch adds stay
      # pending -- see the script for why a plain db:migrate runs no migration code.
      - name: Replay migrations added on this branch
        run: bin/ci-migration-replay HEAD^

  fasterer:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Run fasterer
        run: bundle exec fasterer

  performance:
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_DEVELOPMENT_DATABASE: paid_test
      PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
      PAID_TEST_DATABASE: paid_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/paid_test
      DB_HOST: localhost
      PGHOST: localhost
      PGPORT: 5432
      DB_USERNAME: postgres
      PGUSER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
      TMPDIR: ${{ github.workspace }}/.tmp-build
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache-yarn
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            delimiter="ghadelim_$(openssl rand -hex 16)"
            {
              echo "RAILS_TEST_KEY<<${delimiter}"
              printf '%s\n' "$RAILS_MASTER_KEY_FALLBACK"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace cache directories
        run: mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME" "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME"
          yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          # GitHub's Ubuntu runners sometimes ship unrelated Microsoft sources
          # that transiently 403 and break apt-get update before PGDG installs.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -print0 | xargs -0 --no-run-if-empty grep -lZ 'packages.microsoft.com' | sudo xargs -0 --no-run-if-empty rm -f
          # Ubuntu archive downloads also stall mid-transfer on some runners; apt
          # then waits forever and the job dies at its overall timeout. Bound each
          # apt command and retry so a stalled mirror costs minutes, not the run.
          apt_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 5m apt-get \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Acquire::Retries=3 "$@"; then
                return 0
              fi
              echo "::warning::apt-get $* timed out or failed (attempt $attempt/3); retrying"
              sleep "$((attempt * 10))"
            done
            return 1
          }
          apt_with_retry update
          apt_with_retry install -y postgresql-client-16

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Bootstrap test defaults
        run: bin/rails ci:bootstrap_test_defaults

      - name: Run performance benchmarks
        run: >
          scripts/performance/benchmark.rb
          --seed-ci-data
          --require-metrics container_startup_time,workflow_latency,dashboard_load_time,search_latency
          --baseline docs/performance/baseline.json
          --fail-on-regression

      - name: Print performance report
        run: cat tmp/performance/report.md
