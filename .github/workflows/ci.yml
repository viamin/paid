name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Prepare RuboCop cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run lint checks
        run: bin/lint

      - name: Verify Postgres image pins are in sync
        # All three files must pin the same postgres:<tag> so that schema.rb
        # dumps are byte-identical across dev, devcontainer, and CI. Drift
        # across minor versions causes cosmetic pg_get_expr() churn in schema.rb.
        run: |
          dev=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .devcontainer/compose.yaml | head -1 | awk '{print $NF}')
          compose=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' docker-compose.yml | head -1 | awk '{print $NF}')
          ci=$(grep -oE 'image:[[:space:]]+postgres:[^[:space:]]+' .github/workflows/ci.yml | head -1 | awk '{print $NF}')
          echo "devcontainer/compose.yaml: ${dev:-<none>}"
          echo "docker-compose.yml:        ${compose:-<none>}"
          echo ".github/workflows/ci.yml:  ${ci:-<none>}"
          if [ -z "$dev" ] || [ -z "$compose" ] || [ -z "$ci" ]; then
            echo "::error::Postgres image pin missing in one or more files"
            exit 1
          fi
          if [ "$dev" != "$compose" ] || [ "$compose" != "$ci" ]; then
            echo "::error::Postgres image pins are out of sync. Update all three together."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      DB_HOST: localhost
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install ast-grep
        run: bin/install-ast-grep

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:prepare

      - name: Verify Qdrant health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused "$QDRANT_URL/healthz"

      - name: Run tests
        run: bin/rspec

  performance:
    runs-on: ubuntu-latest
    if: vars.PAID_PERFORMANCE_BENCHMARKS == 'true'

    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      DB_HOST: localhost
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Set up database
        run: bin/rails db:prepare

      - name: Run performance benchmarks
        run: >
          scripts/performance/benchmark.rb
          --seed-ci-data
          --require-metrics container_startup_time,workflow_latency,dashboard_load_time,search_latency
          --baseline docs/performance/baseline.json
          --fail-on-regression

      - name: Print performance report
        run: cat tmp/performance/report.md
