name: Ephemeral PR Tests

# One-off system/integration tests that live only on PR branches.
# See .ephemeral-tests/README.md for usage.
#
# Security model:
#   - Only runs for same-repo PRs (trusted collaborators).
#   - Fork PRs are explicitly excluded — no secret access, no execution.
#   - GITHUB_TOKEN is scoped to contents:read at the workflow level; only the
#     comment-results job additionally needs pull-requests:write (for posting
#     result comments in the PR conversation).
#   - Tests run through standard RSpec / Capybara / Playwright — no raw
#     shell execution from PR content.
#   - Hard 20-minute timeout prevents runaway tests.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ephemeral-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect ephemeral tests
    if: >-
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check.outputs.has_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for test files
        id: check
        run: |
          if find .ephemeral-tests -name '*_spec.rb' -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Ephemeral test files found."
          elif find .ephemeral-tests \( -name '*_test.js' -o -name '*_test.ts' \) -print -quit | grep -q .; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "Ephemeral test files found (JS/TS only — not yet supported)."
            echo "::warning::JS/TS ephemeral tests are detected but not yet supported. Use *_spec.rb instead."
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No ephemeral test files found."
          fi

  run-tests:
    name: Run ephemeral tests
    needs: detect
    if: >-
      needs.detect.outputs.has_tests == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_DEVELOPMENT_DATABASE: paid_test
      PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
      PAID_TEST_DATABASE: paid_test
      DB_HOST: localhost
      PGHOST: localhost
      PGPORT: 5432
      DB_USERNAME: postgres
      PGUSER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
      TMPDIR: ${{ github.workspace }}/.tmp-build
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache-yarn
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      COVERAGE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            delimiter="ghadelim_$(openssl rand -hex 16)"
            {
              echo "RAILS_TEST_KEY<<${delimiter}"
              printf '%s\n' "$RAILS_MASTER_KEY_FALLBACK"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace cache directories
        run: mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME" "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .tool-versions
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME"
          yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        # @spec TOOLCHAIN-PIN-028
        run: |
          # The PGDG signing key download flakes on GitHub runners. Publishing an
          # unverified key makes every later apt-get update fail with "The repository
          # ... is not signed" and takes the whole job down, so fetch the key with
          # retries, verify it, and only then trust the repository. Without a usable
          # key the same major client is installed from the runner image's own archive.
          keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          key_download="$(mktemp)"
          sudo install -d /usr/share/postgresql-common/pgdg
          key_ready=false
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key_download" \
              && gpg --batch --with-colons --show-keys "$key_download" | awk -F: '$1 == "fpr" { valid = ($10 == "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"); exit } END { exit(valid ? 0 : 1) }'; then
              sudo mv "$key_download" "$keyring"
              key_ready=true
              break
            fi
            echo "::warning::PGDG signing key download failed (attempt $attempt/3); retrying"
            rm -f "$key_download"
            sleep "$((attempt * 5))"
          done
          rm -f "$key_download"
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: %s\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" "$keyring" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          # GitHub's Ubuntu runners sometimes ship unrelated Microsoft sources
          # that transiently 403 and break apt-get update before PGDG installs.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -print0 | xargs -0 --no-run-if-empty grep -lZ 'packages.microsoft.com' | sudo xargs -0 --no-run-if-empty rm -f
          # Bound each apt command and retry so a stalled mirror costs minutes
          # instead of the job dying at its overall timeout.
          apt_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 5m apt-get \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Acquire::Retries=3 "$@"; then
                return 0
              fi
              echo "::warning::apt-get $* timed out or failed (attempt $attempt/3); retrying"
              sleep "$((attempt * 10))"
            done
            return 1
          }
          if [ "$key_ready" != true ]; then
            echo "::warning::PGDG signing key unavailable; installing postgresql-client-16 from the runner image archive"
            sudo rm -f /etc/apt/sources.list.d/pgdg.sources "$keyring"
          fi
          if ! apt_with_retry update; then
            echo "::warning::apt-get update failed; retrying without the PGDG repository"
            sudo rm -f /etc/apt/sources.list.d/pgdg.sources "$keyring"
            apt_with_retry update
          fi
          apt_with_retry install -y postgresql-client-16
          psql --version

      - name: Locate Chromium-family browser
        run: |
          path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -n "$path" ]; then
            echo "CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
            "$path" --version
          else
            echo "No Chromium-family browser found; falling back to rack_test."
          fi

      - name: Build assets
        run: yarn build && yarn build:css

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Bootstrap test defaults
        run: bin/rails ci:bootstrap_test_defaults

      - name: Run ephemeral RSpec tests
        run: |
          spec_files=$(find .ephemeral-tests -name '*_spec.rb')
          if [ -n "$spec_files" ]; then
            # shellcheck disable=SC2086
            bin/rspec $spec_files
          else
            echo "::error::No RSpec test files found. Only *_spec.rb files are supported."
            exit 1
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ephemeral-test-failures
          path: |
            tmp/capybara/**
            log/test.log
          if-no-files-found: ignore
          retention-days: 7

  comment-results:
    name: Reconcile ephemeral test PR comment
    needs: [detect, run-tests]
    if: >-
      always()
      && (
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        || contains(fromJson('["dependabot[bot]","renovate[bot]","github-actions[bot]","paid-agents[bot]"]'), github.event.pull_request.user.login)
      )
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TESTS: ${{ needs.detect.outputs.has_tests }}
          RUN_TESTS_RESULT: ${{ needs.run-tests.result }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          marker="<!-- ephemeral-tests-result -->"
          existing_comment_id=$(gh api \
            --paginate \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | head -n 1)

          if [ "$HAS_TESTS" != "true" ]; then
            if [ -n "$existing_comment_id" ]; then
              gh api \
                "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" \
                --method DELETE
            fi
            exit 0
          fi

          conclusion="$RUN_TESTS_RESULT"
          if [ "$conclusion" = "success" ]; then
            body="${marker}
          ## Ephemeral Tests: passed

          All one-off tests passed. These tests will not run on \`${BASE_REF}\` after merge."
          else
            body="${marker}
          ## Ephemeral Tests: ${conclusion}

          Ephemeral tests did not complete successfully. Check the logs for details."
          fi

          if [ -n "$existing_comment_id" ]; then
            gh api \
              "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" \
              --method PATCH \
              --field body="$body"
          else
            gh api \
              "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --method POST \
              --field body="$body"
          fi
