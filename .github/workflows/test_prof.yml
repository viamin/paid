name: Test Prof

on:
  workflow_dispatch:
    inputs:
      profiler:
        description: "Profiler to run"
        required: true
        default: factory_prof
        type: choice
        options:
          - factory_prof
          - factory_doctor

permissions:
  contents: read

concurrency:
  group: test-prof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    env:
      BUNDLE_FROZEN: "true"
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
      PAID_TEST_DATABASE: paid_test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TMPDIR: ${{ github.workspace }}/.tmp-build
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache-yarn
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      QDRANT_URL: http://localhost:6333
      COVERAGE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace cache directories
        run: mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME" "$npm_config_cache" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .tool-versions
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          mkdir -p "$TMPDIR" "$YARN_CACHE_FOLDER" "$XDG_CACHE_HOME"
          yarn install --frozen-lockfile && bin/yarn-postinstall

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16=16.14-1.pgdg24.04+1

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Bootstrap test defaults
        run: bin/rails ci:bootstrap_test_defaults

      - name: Verify Qdrant health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused "$QDRANT_URL/healthz"

      - name: Run test-prof
        run: |
          set -o pipefail
          mkdir -p tmp/test_prof
          case "${{ inputs.profiler }}" in
            factory_prof)
              FPROF=1 bin/rspec --exclude-pattern "spec/performance/**/*_spec.rb,spec/system/**/*_spec.rb" | tee tmp/test_prof/factory_prof.log
              ;;
            factory_doctor)
              FDOC=1 bin/rspec --exclude-pattern "spec/performance/**/*_spec.rb,spec/system/**/*_spec.rb" | tee tmp/test_prof/factory_doctor.log
              ;;
          esac

      - name: Upload test-prof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-prof-${{ inputs.profiler }}
          path: tmp/test_prof/**
          if-no-files-found: warn
          retention-days: 7
