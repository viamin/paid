name: Mutation

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_FROZEN: "true"
  RAILS_ENV: test
  SECRET_KEY_BASE: test-secret-key-base
  RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
  PAID_TEST_DATABASE: paid_test
  DB_HOST: localhost
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  MUTANT_OUTPUT_FILE: tmp/mutant.log

jobs:
  incremental:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant incremental
        run: |
          mkdir -p tmp
          set +e
          bundle exec mutant run --usage opensource --since origin/${{ github.base_ref }} 2>&1 | tee "$MUTANT_OUTPUT_FILE"
          status=${PIPESTATUS[0]}
          {
            echo "## Incremental Mutation"
            echo
            echo '```text'
            tail -n 200 "$MUTANT_OUTPUT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant full sweep
        run: |
          mkdir -p tmp
          set +e
          bundle exec mutant run --usage opensource 2>&1 | tee "$MUTANT_OUTPUT_FILE"
          status=${PIPESTATUS[0]}
          {
            echo "## Nightly Mutation Sweep"
            echo
            echo '```text'
            tail -n 200 "$MUTANT_OUTPUT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload full sweep log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-full-log
          path: ${{ env.MUTANT_OUTPUT_FILE }}

  mutation-viamin-parity:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.viamin

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Select viamin parity mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "MUTANT_PARITY_MODE=incremental" >> "$GITHUB_ENV"
            echo "MUTANT_PARITY_TARGET_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "MUTANT_PARITY_MODE=full" >> "$GITHUB_ENV"
          fi
          echo "MUTANT_OUTPUT_FILE=tmp/mutant-viamin.log" >> "$GITHUB_ENV"
          mkdir -p tmp
          : > tmp/mutant-viamin.log

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant viamin parity
        run: |
          chmod +x script/ci/mutation_viamin_parity.sh
          if [ "$MUTANT_PARITY_MODE" = "incremental" ]; then
            script/ci/mutation_viamin_parity.sh incremental "$MUTANT_PARITY_TARGET_REF"
          else
            script/ci/mutation_viamin_parity.sh full
          fi

      - name: Upload parity log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-viamin-parity-log
          path: ${{ env.MUTANT_OUTPUT_FILE }}
          if-no-files-found: ignore
