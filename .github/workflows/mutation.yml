name: Mutation

on:
  pull_request:
    branches: [ main ]
    # @spec MUTATION-CI-001 MUTATION-CI-003
    paths:
      - 'app/services/tenant_context.rb'
      - 'app/services/prompts/build_for_issue.rb'
      - 'app/services/prompts/build_for_pr.rb'
      - 'app/policies/application_policy.rb'
      - 'app/policies/operator_console/base_policy.rb'
      - 'spec/services/tenant_context_spec.rb'
      - 'spec/services/prompts/build_for_issue_spec.rb'
      - 'spec/services/prompts/build_for_pr_spec.rb'
      - 'spec/policies/application_policy_spec.rb'
      - 'spec/policies/operator_console/base_policy_spec.rb'
      - 'spec/support/**'
      - 'spec/factories/**'
      - 'spec/fixtures/**'
      - 'spec/spec_helper.rb'
      - 'spec/rails_helper.rb'
      - 'config/**'
      - 'lib/**'
      - 'db/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.mutant.yml'
      - '.tool-versions'
      - '.rspec'
      - '.simplecov'
      - 'bin/rspec'
      - 'bin/rails'
      - 'Rakefile'
      - 'config.ru'
      - '.github/workflows/mutation.yml'
  # @spec MUTATION-CI-002
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_FROZEN: "true"
  RAILS_ENV: test
  SECRET_KEY_BASE: test-secret-key-base
  RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
  PAID_DEVELOPMENT_DATABASE: paid_test
  PAID_DEVELOPMENT_CABLE_DATABASE: paid_test
  PAID_TEST_DATABASE: paid_test
  DATABASE_URL: postgres://paid:paid@localhost:5432/paid_test
  DB_HOST: localhost
  DB_USERNAME: paid
  DB_PASSWORD: paid
  MUTANT_OUTPUT_FILE: tmp/mutant.log
  # Mutation sweeps only exercise the configured subjects, so whole-codebase
  # line coverage is near zero. Disable SimpleCov so its minimum_coverage gate
  # can't fail the run and its per-fork instrumentation can't stall workers.
  COVERAGE: "false"

jobs:
  incremental:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql --version

      # @spec POSTGRESQL-PERSISTENCE-002
      - name: Create application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h "$DB_HOST" -U postgres -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'paid') THEN
              CREATE ROLE paid LOGIN PASSWORD 'paid';
            ELSE
              ALTER ROLE paid WITH LOGIN PASSWORD 'paid';
            END IF;
          END
          $$;
          ALTER ROLE paid CREATEDB CREATEROLE NOSUPERUSER NOBYPASSRLS;
          SQL

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant incremental
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p tmp
          set +e
          bundle exec mutant run --since "origin/${BASE_REF}" 2>&1 | tee "$MUTANT_OUTPUT_FILE"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -Fq "No subjects matched the configured diff filter. No mutations to test." "$MUTANT_OUTPUT_FILE"; then
            echo "Mutant found no changed configured subjects; treating incremental run as a pass."
            status=0
          fi
          {
            echo "## Incremental Mutation"
            echo
            echo '```text'
            tail -n 200 "$MUTANT_OUTPUT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql --version

      # @spec POSTGRESQL-PERSISTENCE-002
      - name: Create application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h "$DB_HOST" -U postgres -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'paid') THEN
              CREATE ROLE paid LOGIN PASSWORD 'paid';
            ELSE
              ALTER ROLE paid WITH LOGIN PASSWORD 'paid';
            END IF;
          END
          $$;
          ALTER ROLE paid CREATEDB CREATEROLE NOSUPERUSER NOBYPASSRLS;
          SQL

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant full sweep
        run: |
          mkdir -p tmp
          set +e
          bundle exec mutant run 2>&1 | tee "$MUTANT_OUTPUT_FILE"
          status=${PIPESTATUS[0]}
          {
            echo "## Nightly Mutation Sweep"
            echo
            echo '```text'
            tail -n 200 "$MUTANT_OUTPUT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload full sweep log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-full-log
          path: ${{ env.MUTANT_OUTPUT_FILE }}
