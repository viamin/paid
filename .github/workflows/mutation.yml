name: Mutation

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_FROZEN: "true"
  RAILS_ENV: test
  SECRET_KEY_BASE: test-secret-key-base
  RAILS_TEST_KEY: ${{ secrets.RAILS_TEST_KEY }}
  PAID_TEST_DATABASE: paid_test
  DB_HOST: localhost
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  MUTANT_OUTPUT_FILE: tmp/mutant.log
  # Mutation sweeps only exercise the configured subjects, so whole-codebase
  # line coverage is near zero. Disable SimpleCov so its minimum_coverage gate
  # can't fail the run and its per-fork instrumentation can't stall workers.
  COVERAGE: "false"

jobs:
  incremental:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant incremental
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p tmp
          set +e
          bundle exec mutant run --since "origin/${BASE_REF}" 2>&1 | tee "$MUTANT_OUTPUT_FILE"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -Fq "No subjects matched the configured diff filter. No mutations to test." "$MUTANT_OUTPUT_FILE"; then
            echo "Mutant found no changed configured subjects; treating incremental run as a pass."
            status=0
          fi
          {
            echo "## Incremental Mutation"
            echo
            echo '```text'
            tail -n 200 "$MUTANT_OUTPUT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize test master key
        if: env.RAILS_TEST_KEY == ''
        env:
          RAILS_MASTER_KEY_FALLBACK: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          if [ -n "$RAILS_MASTER_KEY_FALLBACK" ]; then
            echo "RAILS_TEST_KEY=$RAILS_MASTER_KEY_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Prepare database
        run: bundle exec bin/rails db:prepare

      - name: Mutant full sweep
        run: |
          mkdir -p tmp
          set +e
          bundle exec mutant run 2>&1 | tee "$MUTANT_OUTPUT_FILE"
          status=${PIPESTATUS[0]}
          {
            echo "## Nightly Mutation Sweep"
            echo
            echo '```text'
            tail -n 200 "$MUTANT_OUTPUT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload full sweep log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-full-log
          path: ${{ env.MUTANT_OUTPUT_FILE }}
