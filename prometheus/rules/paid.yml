groups:
  - name: paid-availability
    rules:
      - alert: PaidMetricsEndpointDown
        expr: up{job="paid"} == 0
        for: 2m
        labels:
          severity: critical
          service: paid-web
        annotations:
          summary: Paid metrics endpoint is down
          description: Prometheus has failed to scrape the Rails /api/metrics endpoint for 2 minutes.

      - alert: PaidTemporalWorkerMetricsDown
        expr: up{job="paid-temporal-worker"} == 0
        for: 2m
        labels:
          severity: critical
          service: paid-temporal-worker
        annotations:
          summary: Paid Temporal worker metrics are down
          description: Prometheus has failed to scrape the Temporal worker Prometheus exporter for 2 minutes.

      - alert: PaidPostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 5m
        labels:
          severity: warning
          service: postgres-exporter
        annotations:
          summary: Postgres exporter is down
          description: PostgreSQL infrastructure metrics are unavailable because postgres-exporter is not being scraped.

  - name: paid-capacity
    rules:
      - alert: PaidQueuedRunsBacklog
        expr: paid_agent_runs_queued > 10
        for: 10m
        labels:
          severity: warning
          service: paid-web
        annotations:
          summary: Agent run queue is backing up
          description: There are more than 10 queued agent runs for at least 10 minutes.

      - alert: PaidGoodJobBacklog
        expr: sum(paid_goodjob_queue_depth) > 50
        for: 10m
        labels:
          severity: warning
          service: good_job
        annotations:
          summary: GoodJob backlog is elevated
          description: More than 50 unfinished GoodJob jobs are waiting across queues.

      - alert: PaidTemporalWorkflowSlotsSaturated
        expr: paid_temporal_workflow_utilization_percent > 90
        for: 10m
        labels:
          severity: warning
          service: paid-temporal-worker
        annotations:
          summary: Temporal workflow slots are saturated
          description: Workflow slot utilization has exceeded 90 percent for 10 minutes.

      - alert: PaidTemporalWorkflowScheduleToStartP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (task_queue, le) (
              rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket[5m])
            )
          ) > 30
        for: 10m
        labels:
          severity: warning
          service: paid-temporal-worker
        annotations:
          summary: Temporal workflow queue latency is elevated
          description: Workflow task schedule-to-start p95 latency has exceeded 30 seconds for 10 minutes.

      - alert: PaidTemporalActivityScheduleToStartP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (task_queue, le) (
              rate(temporal_activity_schedule_to_start_latency_seconds_bucket[5m])
            )
          ) > 30
        for: 10m
        labels:
          severity: warning
          service: paid-temporal-worker
        annotations:
          summary: Temporal activity queue latency is elevated
          description: Activity task schedule-to-start p95 latency has exceeded 30 seconds for 10 minutes.

      - alert: PaidContainerMemoryPressure
        expr: paid_containers_avg_memory_percent > 85
        for: 10m
        labels:
          severity: warning
          service: agent-containers
        annotations:
          summary: Agent container memory pressure is high
          description: Average memory utilization across active agent containers has exceeded 85 percent.

      - alert: PaidServiceContainerMemoryPressure
        expr: paid_service_containers_avg_memory_percent > 85
        for: 10m
        labels:
          severity: warning
          service: service-containers
        annotations:
          summary: Service container memory pressure is high
          description: Average memory utilization across running service containers has exceeded 85 percent.
