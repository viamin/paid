global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: paid

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: paid
    metrics_path: /api/metrics
    # Optional bearer auth for the Rails /api/metrics endpoint. The token is
    # read from /etc/prometheus/metrics_token at scrape time, which the
    # docker-compose.observability.yml overlay materializes from the host's
    # METRICS_TOKEN environment variable (the file is created as empty when
    # the variable is unset, which keeps the scrape header empty so the Rails
    # side skips its token check).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets:
          - web:3000

  - job_name: paid-temporal-worker
    static_configs:
      - targets:
          - worker:9464

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
