global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: paid

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: paid
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - web:3000

  - job_name: paid-temporal-worker
    static_configs:
      - targets:
          - worker:9464

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
